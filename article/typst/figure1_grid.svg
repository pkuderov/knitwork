<svg width="760" height="430" viewBox="0 0 760 430"
     xmlns="http://www.w3.org/2000/svg"
     font-family="'Linux Libertine O', 'Libertinus Serif', Georgia, serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#475569"/>
    </marker>
    <marker id="feedback" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#D97706"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="1" dy="1" stdDeviation="1.2" flood-color="#00000022"/>
    </filter>
  </defs>

  <rect width="760" height="430" rx="8" fill="#FCFCFD"/>
  <text x="380" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">
    MoSAIC recurrent routing at timestep t
  </text>

  <!-- Initial message bank -->
  <rect x="35" y="325" width="265" height="64" rx="8"
        fill="#FFF7ED" stroke="#D97706" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="167" y="347" text-anchor="middle" font-size="12" font-weight="bold" fill="#9A3412">
    First-layer message bank M_t^0
  </text>
  <text x="167" y="369" text-anchor="middle" font-size="11" fill="#7C2D12">
    delayed top layer H_(t-1)^(L-1)  +  input e_t
  </text>

  <!-- Layer 0 routing -->
  <rect x="345" y="321" width="155" height="72" rx="9"
        fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="422" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#6B21A8">
    Learned routing 0
  </text>
  <text x="422" y="364" text-anchor="middle" font-size="10.5" fill="#6B21A8">
    Q = H_(t-1)^0
  </text>
  <text x="422" y="380" text-anchor="middle" font-size="10" fill="#7E22CE">
    multi-head attention + IDs
  </text>

  <!-- Layer 0 GRUs -->
  <rect x="550" y="317" width="170" height="80" rx="9"
        fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="635" y="339" text-anchor="middle" font-size="12" font-weight="bold" fill="#1D4ED8">
    Independent GRU bank 0
  </text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="565" y="351" width="29" height="29" rx="4" fill="#DBEAFE" stroke="#60A5FA"/>
    <rect x="602" y="351" width="29" height="29" rx="4" fill="#DBEAFE" stroke="#60A5FA"/>
    <rect x="639" y="351" width="29" height="29" rx="4" fill="#DBEAFE" stroke="#60A5FA"/>
    <rect x="676" y="351" width="29" height="29" rx="4" fill="#DBEAFE" stroke="#60A5FA"/>
    <text x="580" y="370" fill="#1E40AF">0</text>
    <text x="617" y="370" fill="#1E40AF">1</text>
    <text x="654" y="370" fill="#1E40AF">2</text>
    <text x="691" y="370" fill="#1E40AF">C-1</text>
  </g>

  <line x1="300" y1="357" x2="337" y2="357" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <line x1="500" y1="357" x2="542" y2="357" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>

  <!-- Intermediate message bank -->
  <rect x="35" y="203" width="265" height="58" rx="8"
        fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="167" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">
    Higher-layer bank M_t^l
  </text>
  <text x="167" y="246" text-anchor="middle" font-size="11" fill="#475569">
    newly updated lower layer H_t^(l-1)
  </text>

  <rect x="345" y="196" width="155" height="72" rx="9"
        fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="422" y="219" text-anchor="middle" font-size="12" font-weight="bold" fill="#6B21A8">
    Learned routing l
  </text>
  <text x="422" y="239" text-anchor="middle" font-size="10.5" fill="#6B21A8">
    Q = H_(t-1)^l
  </text>
  <text x="422" y="255" text-anchor="middle" font-size="10" fill="#7E22CE">
    C routed inputs X_t^l
  </text>

  <rect x="550" y="192" width="170" height="80" rx="9"
        fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="635" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#1D4ED8">
    Independent GRU bank l
  </text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="565" y="226" width="29" height="29" rx="4" fill="#DBEAFE" stroke="#60A5FA"/>
    <rect x="602" y="226" width="29" height="29" rx="4" fill="#DBEAFE" stroke="#60A5FA"/>
    <rect x="639" y="226" width="29" height="29" rx="4" fill="#DBEAFE" stroke="#60A5FA"/>
    <rect x="676" y="226" width="29" height="29" rx="4" fill="#DBEAFE" stroke="#60A5FA"/>
    <text x="580" y="245" fill="#1E40AF">0</text>
    <text x="617" y="245" fill="#1E40AF">1</text>
    <text x="654" y="245" fill="#1E40AF">2</text>
    <text x="691" y="245" fill="#1E40AF">C-1</text>
  </g>

  <line x1="300" y1="232" x2="337" y2="232" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <line x1="500" y1="232" x2="542" y2="232" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M635,317 L635,281 L167,281 L167,269" fill="none"
        stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="298" text-anchor="middle" font-size="10" fill="#475569">
    bottom-up within timestep t
  </text>

  <!-- Top layer and readout -->
  <rect x="550" y="68" width="170" height="80" rx="9"
        fill="#ECFDF5" stroke="#059669" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="635" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">
    Top layer H_t^(L-1)
  </text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="565" y="102" width="29" height="29" rx="4" fill="#D1FAE5" stroke="#34D399"/>
    <rect x="602" y="102" width="29" height="29" rx="4" fill="#D1FAE5" stroke="#34D399"/>
    <rect x="639" y="102" width="29" height="29" rx="4" fill="#D1FAE5" stroke="#34D399"/>
    <rect x="676" y="102" width="29" height="29" rx="4" fill="#D1FAE5" stroke="#34D399"/>
    <text x="580" y="121" fill="#065F46">0</text>
    <text x="617" y="121" fill="#065F46">1</text>
    <text x="654" y="121" fill="#065F46">2</text>
    <text x="691" y="121" fill="#065F46">C-1</text>
  </g>

  <line x1="635" y1="192" x2="635" y2="156" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>

  <rect x="345" y="79" width="145" height="52" rx="8"
        fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="417" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">
    Readout head
  </text>
  <text x="417" y="119" text-anchor="middle" font-size="10" fill="#166534">
    o_t = h_t^(L-1,0)
  </text>
  <line x1="550" y1="108" x2="498" y2="108" stroke="#059669" stroke-width="1.7" marker-end="url(#arrow)"/>

  <!-- Delayed feedback loop -->
  <path d="M720,108 C744,108 744,177 744,291 C744,414 167,414 167,397"
        fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="6 4"
        marker-end="url(#feedback)"/>
  <text x="646" y="418" text-anchor="middle" font-size="10" fill="#B45309">
    complete top layer delayed to timestep t+1
  </text>

  <!-- Ellipsis between generic and top layers -->
  <text x="635" y="174" text-anchor="middle" font-size="18" fill="#64748B">⋮</text>
</svg>
