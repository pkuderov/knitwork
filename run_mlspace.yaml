container:
  image: "cr.ai.cloud.ru/0be50883-779e-4f89-a2c2-6befd3879c6f/cuda12.2_uv0.10.4:latest"

  # L3C4 uses ~13.5GB gpu 
  command: cd knitwork/exps/text && uv run run.py config/large.yaml --model=grnn.L3C4 --n_steps=2e+9 --rollout_len=128
  # ==> Text
  # command: cd knitwork/exps/text && uv run run.py config/large.yaml --model=grnn.L2C4 && uv run run.py config/large.yaml --model=grnn.L2C8 && uv run run.py config/large.yaml --model=grnn.L1C8 && uv run run.py config/large.yaml --model=grnn.L3C4 && uv run run.py config/large.yaml --model=grnn.L2C16
  # command: cd knitwork/exps/text && uv run run.py config/large.yaml --model=rnn.L1 && uv run run.py config/large.yaml --model=rnn.L2 && uv run run.py config/large.yaml --model=rnn.L3
  # command: cd knitwork/exps/text && uv run run.py config/large.yaml --model=delta_net --n_envs=64 --n_steps=2.0e+8 --log.schedule=1.0e+6 --eval.schedule=4.0e+6 && uv run run.py config/large.yaml --model=hgrn2 --n_envs=32 --n_steps=1.0e+8 --log.schedule=1.0e+6 --eval.schedule=4.0e+6 && uv run run.py config/large.yaml --model=mlstm --n_envs=64 --n_steps=2.0e+8 --log.schedule=1.0e+6 --eval.schedule=4.0e+6
  # command: cd knitwork/exps/text && uv run run_offline.py config/large.yaml --model=transformer && uv run run_offline.py config/large.yaml --model=transformer.64 && uv run run_offline.py config/large.yaml --model=transformer.64

  # ==> SDQ
  # command: cd knitwork/exps/sdq && uv run run.py config/large.yaml --model=grnn.L2C4 && uv run run.py config/large.yaml --model=grnn.L2C8 && uv run run.py config/large.yaml --model=grnn.L1C8 && uv run run.py config/large.yaml --model=grnn.L3C4 && uv run run.py config/large.yaml --model=grnn.L2C16
  # command: cd knitwork/exps/sdq && uv run run.py config/large.yaml --model=rnn.L1 && uv run run.py config/large.yaml --model=rnn.L2 && uv run run.py config/large.yaml --model=rnn.L3  
  # command: cd knitwork/exps/sdq && uv run run.py config/large.yaml --model=mlstm --n_envs=128 --n_steps=2.5e+8 --log.schedule=1.25e+6 --curriculum.schedule=5.0e+4 && uv run run.py config/large.yaml --model=hgrn2 --n_envs=64 --n_steps=1.25e+8 --log.schedule=0.75e+6 --curriculum.schedule=2.5e+4 && uv run run.py config/large.yaml --model=delta_net --n_envs=128 --n_steps=2.5e+8 --log.schedule=1.25e+6 --curriculum.schedule=5.0e+4

  # ==> RL Mikasa
  # command: cd knitwork/exps/mikasa && uv run run.py config/large.yaml --model=rnn.L2 --env-id=0 --n_steps=3e7 && uv run run.py config/large.yaml --model=grnn.L2C4 --env-id=0 --n_steps=3e7
  # command: cd knitwork/exps/mikasa && uv run run.py config/large.yaml --model=rnn.L2 --env-id=7 --n_steps=3e7 && uv run run.py config/large.yaml --model=grnn.L2C4 --env-id=7 --n_steps=3e7
  # command: cd knitwork/exps/mikasa && uv run run.py config/large.yaml --model=rnn.L2 --env-id=1 --n_steps=4e7 && uv run run.py config/large.yaml --model=grnn.L2C4 --env-id=1 --n_steps=4e7 && uv run run.py config/large.yaml --model=rnn.L2 --env-id=1 --n_steps=4e7 && uv run run.py config/large.yaml --model=grnn.L2C4 --env-id=1 --n_steps=4e7 && uv run run.py config/large.yaml --model=rnn.L2 --env-id=1 --n_steps=4e7 && uv run run.py config/large.yaml --model=grnn.L2C4 --env-id=1 --n_steps=4e7

  # ENV vars
  environment:
    "MY_HOME": "$MY_HOME"
    "UV_CACHE_DIR": "$UV_CACHE_DIR"
    "MPLBACKEND": "Agg"
    "COMET_API_KEY": "$COMET_API_KEY"
    "SETUPTOOLS_USE_DISTUTILS": "local"

    # Added to job description
    "TEAM_NAME": "knitwork/$ME"
  
  # Local working directory, recommend leaving as default
  work_dir: '.'

  # Whether to run from a copy of the working directory
  run_from_copy: False
  # run_from_copy: True

  # Local path for creating working directory copies
  cry_copy_dir: "$MY_HOME/.cryri"
  exclude_from_copy:
    - ".git"
    - "_supp"
    - ".agents"
    - ".claude"
    - ".github"
    - ".venv"
    - "agents"
    - "article"
    - "docs"
    - "knitwork.egg-info"
    - "shiroa"
    - "build"

cloud:
  region: "SR006"
  
  # Type of cloud instance (check the command to list available instances in cryri readme)
  instance_type: "a100plus.1gpu.80vG.12C.96G"
  # instance_type: "CPU.2C.8G"

  # Number of worker instances, 1 is the only option
  n_workers: 1
  
  # Job priority. Options: ['high', 'medium', 'low']. 
  #   Jobs with higher priority will stop running jobs with lower priority if all resources are allocated.
  # priority: "medium"
  
  # Job description 
  description: "mikasa 0"
