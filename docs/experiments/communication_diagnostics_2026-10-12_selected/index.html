<!doctype html><html lang="ru"><meta charset="utf-8"><title>Column diagnostics</title><style>body{font-family:system-ui;max-width:1250px;margin:32px auto;padding:0 20px;color:#222}img{width:100%}figure{margin:30px 0}figcaption{color:#555;line-height:1.5}</style><h1>Диагностика памяти локальных ablation</h1><p><a href="report.md">Полный отчёт</a> · <a href="all_figures.pdf">PDF графиков</a></p><figure><img src="cka_text8_L1.svg"><figcaption>TEXT8, слой 1: linear CKA состояний на одинаковых проверочных событиях. Высокое значение означает сходство представлений; низкое не доказывает статистическую независимость.</figcaption></figure><figure><img src="cka_text8_L2.svg"><figcaption>TEXT8, слой 2: linear CKA состояний на одинаковых проверочных событиях. Высокое значение означает сходство представлений; низкое не доказывает статистическую независимость.</figcaption></figure><figure><img src="cka_sdq_L1.svg"><figcaption>SDQ, слой 1: linear CKA состояний на одинаковых проверочных событиях. Высокое значение означает сходство представлений; низкое не доказывает статистическую независимость.</figcaption></figure><figure><img src="cka_sdq_L2.svg"><figcaption>SDQ, слой 2: linear CKA состояний на одинаковых проверочных событиях. Высокое значение означает сходство представлений; низкое не доказывает статистическую независимость.</figcaption></figure><figure><img src="sdq_stored_value.svg"><figcaption>SDQ: accuracy линейного чтения последнего сохранённого значения запрошенного ключа. Включены только запросы с предшествующей записью.</figcaption></figure><figure><img src="sdq_query_answer.svg"><figcaption>SDQ: accuracy линейного чтения полного ответа задачи, включая distractor accumulator и store/query counters. Native — исходная голова на той же выборке известных записей.</figcaption></figure><figure><img src="sdq_query_state_lesions.svg"><figcaption>SDQ: перед текущим запросом обнулены оба слоя одной колонки; исходная голова сохранена. Положительное число — падение accuracy. Изменение не переносится на следующие события.</figcaption></figure><figure><img src="sdq_stored_value_gaps.svg"><figcaption>Чтение сохранённого значения на естественных SDQ gaps. В ячейках с менее чем 32 запросами число скрыто. Это интервалы естественных gaps, а не исходный fixed-gap benchmark.</figcaption></figure><figure><img src="text8_readouts.svg"><figcaption>Text8: исходная голова и дополнительные линейные головы на замороженной памяти. Новые головы обучались на train-отрывках; таблица оценивает отдельные validation-отрывки.</figcaption></figure><figure><img src="text8_concat_weights.svg"><figcaption>Text8: доли норм четырёх блоков дополнительной concat-головы после учёта масштаба признаков и удаления общего для классов сдвига. Это описание декодера, а не уникальная причинная доля колонки.</figcaption></figure><figure><img src="text8_concat_column_replacement.svg"><figcaption>Text8: блок состояния заменён его средним на probe-train; concat-голова не переобучалась. Положительное число — ухудшение. Взаимозаменяемость коррелированных колонок остаётся ограничением.</figcaption></figure><figure><img src="sdq_concat_column_replacement.svg"><figcaption>SDQ: замена блока верхнего состояния средним для дополнительной concat-головы полного ответа. Это доступность информации для нового декодера; исходная модель остаётся неизменной.</figcaption></figure><figure><img src="text8_native_column_lesions.svg"><figcaption>Text8: перед токеном обнуляются оба слоя одной колонки; исходные router и prediction head сохранены. Каждая из 3584 позиций сравнивается со своим неизменным состоянием. Интервенция не переносится на последующие токены.</figcaption></figure></html>
