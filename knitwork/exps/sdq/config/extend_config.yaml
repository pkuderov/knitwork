seed: null
name: null 

log:
  enabled: true
  logger: aim
  project: grid-rnn-sdq
  schedule: 1e+6
  print_schedule: 5e+6

device: cuda
dtype: float32

gen: hard
model: rnn
rollout_len: 8
n_envs: 128
n_steps: 1e+9

gens:
  easy:
    n_keys: 5
    n_vals: 10
    T: 10
    p_store: 0.35
    p_query: 0.35
    count_stored: false
    count_queried: false
  
  hard:
    n_keys: 5
    n_vals: 10
    T: 10
    p_store: 0.35
    p_query: 0.35
    count_stored: true
    count_queried: true


models:
  rnn:
    embedding_size: 64
    base_hidden_size: 128
    n_layers: 1
    use_bias: true
    dropout: 0.0
  
  grnn:
    embedding_size: 64
    base_hidden_size: 128
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    col_identities: False
    dropout: 0.0

  grnn_err:
    embedding_size: 64
    base_hidden_size: 110
    n_layers: 1
    n_columns: 2
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    col_identities: true

  hgrnn:
    embedding_size: 64
    hidden_size: 128
    n_layers: 1
    n_columns: 2
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0

  grnn_fw:
    embedding_size: 64
    hidden_size: 128
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4      
    messaging: post
    col_identities: true
    fw_decay: 0.9        
    fw_lr: 0.5      

  grnn_reservoir:
    hidden_size: 300
    embedding_size: 64
    n_layers: 3
    n_columns: 5 
    n_reservoir_cols: 2
    n_attn_heads: 4
    messaging: post
    col_identities: true
    spectral_radius: 0.9 
    reservoir_scale: 0.1 

  grnn_hgrn:
    embedding_size: 64
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    hidden_size: 160
    n_layers: 5
    col_identities: true
    beta_min: 0.0
    beta_max: 0.99

  grnn2:
    embedding_size: 72
    hidden_size: 128
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    col_identities: true

    vae_latent_dim: null
    vae_kl_weight: 1.0e-3
    use_time_gate: true

    time_gate_delay_scale: -2.0

    col_drop_prob: 0.0

  grnn_engram:
    embedding_size: 64
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    n_columns: 4
    hidden_size: 128

    n_layers: 4
    col_identities: true

    n_engram_slots: 16

    engram_top_k: 4

    engram_hebb_lr: 0.1
    engram_gate_write: true

  grnn_loss:
    embedding_size: 64
    hidden_size: 128
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    col_identities: true

  grnn_eq:
    embedding_size: 64
    hidden_size: 128
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    use_bias: true
    dropout: 0.0
    col_identities: true

  grnn_eq1:
    embedding_size: 64
    hidden_size: 128
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    use_bias: true
    dropout: 0.0
    col_identities: true

  grnn_disc:
    embedding_size: 64
    hidden_size: 128
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    use_bias: true
    dropout: 0.0
    col_identities: true

  grnn_adv_loss:
    embedding_size: 64
    hidden_size: 128
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    col_identities: true

  grnn_fusion:
    embedding_size: 64
    hidden_size: 192
    n_layers: 5
    n_columns: 5              # 3 trainable + 2 reservoir
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    col_identities: true
    all_cols_get_input: true
    use_cross_attention: true  # NEW: trainable читают из reservoir

    hgrn:
      enabled: true
      beta_min: 0.01
      beta_max: 0.95
      use_final_output_gate: true
      learnable_beta: true

    reservoir:
      enabled: true
      n_reservoir_cols: 2       # ~половина колонок заморожена
      spectral_radius: 0.9      # используется если spectral_radii=null
      spectral_radii: null      # null → автоматически [0.7, 0.95]
      reservoir_scale: 0.1

    diversity_loss:
      enabled: true
      total_weight: 0.05
      cosine_weight: 0.3
      cov_weight: 0.2
      var_weight: 0.1
      gate_entropy_weight: 0.05
      layer_weights: null
      cosine_margin: 0.5
      var_threshold: 0.1
      compute_every_n: 4       # NEW: вычислять каждые 4 шага → ~4× быстрее diversity



  grnn_prec_delta:
    embedding_size: 64
    hidden_size: 128
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    messaging: post
    col_identities: true
    delta_lr: 0.01
    delta_decay: 0.99
    beta2: 0.999
    eps: 1.0e-8

  grnn_ema_mem:
    embedding_size: 64
    hidden_size: 128
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    messaging: post
    col_identities: true
    ema_beta: 0.9
    lam_base: 0.01

  grnn_lru:
    embedding_size: 64
    hidden_size: 128
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    col_identities: true
    dropout: 0.0
    ff_mult: 2          # множитель PFFN
    r_min: 0.0          # минимальный радиус собственных значений
    r_max: 0.999        # максимальный радиус
    lru_r_per_col: true # разные r_max по столбцам (иерархия масштабов)

  grnn_lru_wide:
    # Увеличенная версия для лучших метрик на text8/SDQ-hard
    embedding_size: 96
    hidden_size: 256
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    col_identities: true
    dropout: 0.0
    ff_mult: 3
    r_min: 0.0
    r_max: 0.9995
    lru_r_per_col: true

  grnn_lru_hop:
    embedding_size:  64
    hidden_size: 128
    n_layers:         3
    n_columns:        4
    n_attn_heads:     4
    messaging:        "post"
    dropout:          0.05
    ffn_expansion:    2
    attn_dropout:     0.05
    # LRU-гиперпараметры
    lru_r_min:        0.4
    lru_r_max:        0.99
    lru_max_phase:    2.094395   # pi * 2/3

  grnn_delta:
    embedding_size: 64
    hidden_size: 128
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    dropout: 0.0
    ff_mult: 2
    # LRU per-layer × per-col r_max hierarchy
    r_min_layers: 0.05
    r_max_layers: 0.999
    lru_r_per_col: true
    # two-scale delta memory
    dk_fast: 16
    dv_fast: 16
    dk_slow: 32
    dv_slow: 32
    mem_decay_fast: [0.3, 0.5, 0.7]
    mem_decay_slow: [0.95, 0.98, 0.999]
    use_cross_layer_skip: false

  grnn_delta_wide:
    embedding_size: 96
    hidden_size: 160
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    dropout: 0.0
    ff_mult: 3
    r_min_layers: 0.02
    r_max_layers: 0.9995
    lru_r_per_col: true
    dk_fast: 20
    dv_fast: 20
    dk_slow: 40
    dv_slow: 40
    mem_decay_fast: [0.2, 0.4, 0.6, 0.8]
    mem_decay_slow: [0.9, 0.95, 0.98, 0.999]
    use_cross_layer_skip: true

  grnn_harmonic:
    embedding_size: 64
    hidden_size: 128
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    dropout: 0.0
    ffn_expansion: 2
    attn_dropout: 0.0
    # 2D spectral LRU hierarchy
    r_min_col: 0.3
    r_min_layers: 0.7
    r_max_layers: 0.999
    # Surprise-Delta Memory
    dk: null    # default H // 4 = 32
    dv: null    # default H = 128
    ema_beta: 0.9
    ema_beta_min: 0.7    # per-layer EMA beta: layer0=0.7 (fast) → layerL=0.9 (slow)
    delta_decay: 0.99
    delta_decay_min: 0.95
    lam_base: 0.01
    # Frozen Reservoir (disabled for SDQ — short sequences)
    n_reservoir_cols: 0
    reservoir_hidden_size: 64
    r_res_min: 0.90
    r_res_max: 0.999
    multi_col_head: true    # mean over all columns for associative retrieval


lr:
  val: 8e-4
  rel: 0.02
  lr: 0.005
  schedule: 2000
  warmup:
    val: 1e-9
    n_linear_steps: 50
    schedule: 100

curriculum:
  schedule: 2e+5
  key: Loss
  mode: speed           # speed | threshold | plateau | multiaxis

  # threshold / plateau: set key+minimization to track Acc, then set threshold
  # key: Acc
  # minimization: false
  # threshold: 0.75     # advance only when Acc >= 0.75

  # plateau only:
  # plateau_len: 5      # number of curriculum checks to track
  # plateau_tol: 0.02   # max std to consider metric stable

  # multiaxis only (ignores key/threshold above):
  # t_threshold: 0.75
  # store_threshold: 0.80
  # query_threshold: 0.70