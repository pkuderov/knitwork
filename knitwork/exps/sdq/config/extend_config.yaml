seed: null
name: null 

log:
  enabled: true
  logger: aim
  project: knitwork
  schedule: 1e+6
  print_schedule: 5e+6

device: cuda
dtype: float32

gen: hard
model: rnn
rollout_len: 8
n_envs: 128
n_steps: 1e+9

# weight checkpointing (disabled by default). save_at: list of global steps;
# save_every: 0 disables periodic. files -> {save_dir}/{run_name}/step_{step}.pt
checkpoint:
  enabled: false
  save_dir: runs/checkpoints
  save_at: [40e6, 60e6]
  save_every: 0

gens:
  easy:
    n_keys: 5
    n_vals: 10
    T: 10
    p_store: 0.35
    p_query: 0.35
    count_stored: false
    count_queried: false
  
  hard:
    n_keys: 5
    n_vals: 10
    T: 10
    p_store: 0.35
    p_query: 0.35
    count_stored: true
    count_queried: true


models:
  rnn:
    embedding_size: 64
    base_hidden_size: 128
    n_layers: 1
    use_bias: true
    dropout: 0.0
  
  grnn:
    embedding_size: 64
    base_hidden_size: 128
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    col_identities: False
    dropout: 0.0

  grnn_err:
    embedding_size: 64
    base_hidden_size: 110
    n_layers: 1
    n_columns: 2
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    col_identities: true

  hgrnn:
    embedding_size: 64
    hidden_size: 128
    n_layers: 1
    n_columns: 2
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0

  hgrnn_lru:
    embedding_size: 64
    hidden_size: 128
    n_layers: 2
    n_columns: 2
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    ffn_expansion: 2
    lru_r_min: 0.4
    lru_r_max: 0.99

  grnn_fw:
    embedding_size: 64
    hidden_size: 128
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4      
    messaging: post
    col_identities: true
    fw_decay: 0.9        
    fw_lr: 0.5      

  grnn_reservoir:
    hidden_size: 300
    embedding_size: 64
    n_layers: 3
    n_columns: 5 
    n_reservoir_cols: 2
    n_attn_heads: 4
    messaging: post
    col_identities: true
    spectral_radius: 0.9 
    reservoir_scale: 0.1 

  grnn_hgrn:
    embedding_size: 64
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    hidden_size: 160
    n_layers: 5
    col_identities: true
    beta_min: 0.0
    beta_max: 0.99

  grnn2:
    embedding_size: 72
    hidden_size: 128
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    col_identities: true

    vae_latent_dim: null
    vae_kl_weight: 1.0e-3
    use_time_gate: true

    time_gate_delay_scale: -2.0

    col_drop_prob: 0.0

  grnn_engram:
    embedding_size: 64
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    n_columns: 4
    hidden_size: 128

    n_layers: 4
    col_identities: true

    n_engram_slots: 16

    engram_top_k: 4

    engram_hebb_lr: 0.1
    engram_gate_write: true

  grnn_loss:
    embedding_size: 64
    hidden_size: 128
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    col_identities: true

  grnn_eq:
    embedding_size: 64
    hidden_size: 128
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    use_bias: true
    dropout: 0.0
    col_identities: true

  grnn_eq1:
    embedding_size: 64
    hidden_size: 128
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    use_bias: true
    dropout: 0.0
    col_identities: true

  grnn_disc:
    embedding_size: 64
    hidden_size: 128
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    use_bias: true
    dropout: 0.0
    col_identities: true

  grnn_adv_loss:
    embedding_size: 64
    hidden_size: 128
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    col_identities: true

  grnn_fusion:
    embedding_size: 64
    hidden_size: 192
    n_layers: 5
    n_columns: 5              # 3 trainable + 2 reservoir
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    col_identities: true
    all_cols_get_input: true
    use_cross_attention: true  # NEW: trainable читают из reservoir

    hgrn:
      enabled: true
      beta_min: 0.01
      beta_max: 0.95
      use_final_output_gate: true
      learnable_beta: true

    reservoir:
      enabled: true
      n_reservoir_cols: 2       # ~половина колонок заморожена
      spectral_radius: 0.9      # используется если spectral_radii=null
      spectral_radii: null      # null → автоматически [0.7, 0.95]
      reservoir_scale: 0.1

    diversity_loss:
      enabled: true
      total_weight: 0.05
      cosine_weight: 0.3
      cov_weight: 0.2
      var_weight: 0.1
      gate_entropy_weight: 0.05
      layer_weights: null
      cosine_margin: 0.5
      var_threshold: 0.1
      compute_every_n: 4       # NEW: вычислять каждые 4 шага → ~4× быстрее diversity



  grnn_prec_delta:
    embedding_size: 64
    hidden_size: 128
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    messaging: post
    col_identities: true
    delta_lr: 0.01
    delta_decay: 0.99
    beta2: 0.999
    eps: 1.0e-8

  grnn_ema_mem:
    embedding_size: 64
    hidden_size: 128
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    messaging: post
    col_identities: true
    ema_beta: 0.9
    lam_base: 0.01

  # fixed attention variants (architecture_analysis.md §7.1), ~200K params
  grnn_fix:
    embedding_size: 64
    hidden_size: 64
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    use_bias: true
    dropout: 0.0

  hgrnn_fix:
    embedding_size: 64
    hidden_size: 104
    n_layers: 1
    n_columns: 2
    n_attn_heads: 4
    use_bias: true
    dropout: 0.0

  grnn_fix_v3:
    embedding_size: 64
    hidden_size: 64
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    beta_scale: 3.0
    aux_div_weight: 0.05
    aux_gate_weight: 0.02
    aux_act_weight: 0.02
    aux_every: 8
    gate_std_target: 0.15
    use_bias: true
    dropout: 0.0

  grnn_fix_v4:
    embedding_size: 64
    hidden_size: 64
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.1
    aux_div_ramp_steps: 2e+7
    aux_gate_weight: 0.1
    aux_act_weight: 0.02
    aux_sat_weight: 0.02
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    use_bias: true
    dropout: 0.0

  hgrnn_fix_v4:
    embedding_size: 64
    hidden_size: 56
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.1
    aux_div_ramp_steps: 2e+7
    aux_gate_weight: 0.1
    aux_act_weight: 0.02
    aux_sat_weight: 0.02
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    use_bias: true
    dropout: 0.0

  # n_columns=8 scale-up (~391K params), matches the comet-diagnosed run:
  # emergent per-layer hub topology, but CKA showed a near-duplicate column
  # pair (0.80) and col_sim/max kept climbing in the run's second half.
  # beta_floor/aux_div_max_weight/aux_div_ramp_steps target exactly that.
  grnn_fix_v4_8c:
    embedding_size: 64
    hidden_size: 56
    n_layers: 2
    n_columns: 8
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.1
    aux_div_ramp_steps: 3e+7
    aux_gate_weight: 0.1
    aux_act_weight: 0.02
    aux_sat_weight: 0.02
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    use_bias: true
    dropout: 0.0

  # ablation: n_columns=6 at matched param budget (~409K) vs grnn_fix_v4_8c
  # (~391K) — CKA on the 8c run showed only ~6 of 8 columns non-redundant;
  # this checks whether the 2 extra columns earn their keep at same budget.
  grnn_fix_v4_6c:
    embedding_size: 64
    hidden_size: 68
    n_layers: 2
    n_columns: 6
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.1
    aux_div_ramp_steps: 3e+7
    aux_gate_weight: 0.1
    aux_act_weight: 0.02
    aux_sat_weight: 0.02
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    use_bias: true
    dropout: 0.0

  # scale-up presets (optim=true: latent Barlow + batch-subsample aux + pooled head
  # + per-step grad checkpointing). ~2.0M and ~10.1M params at V=27/E=64.
  grnn_fix_v4_2m:
    embedding_size: 64
    hidden_size: 168
    n_layers: 2
    n_columns: 6
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.1
    aux_div_ramp_steps: 3e+7
    aux_gate_weight: 0.1
    aux_act_weight: 0.02
    aux_sat_weight: 0.02
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 32
    aux_batch_frac: 0.25
    use_bias: true
    dropout: 0.0

  grnn_fix_v4_10m:
    embedding_size: 64
    hidden_size: 344
    n_layers: 2
    n_columns: 8
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.1
    aux_div_ramp_steps: 3e+7
    aux_gate_weight: 0.1
    aux_act_weight: 0.02
    aux_sat_weight: 0.02
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 32
    aux_batch_frac: 0.25
    use_bias: true
    dropout: 0.0

  # base GRNN + top-down feedback: buffer columns get their own prev top-layer
  # output (+ distinct learnable seed) as layer-0 input. H=44 -> ~194K params
  grnn_feedback:
    embedding_size: 64
    hidden_size: 44
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    col_identities: true
    seed_scale: 1.0
    fb_init: 0.1
    use_bias: true
    dropout: 0.0

  # base GRNN + attention-cost penalty (sparse gates). H=48 -> ~185K params
  grnn_attn_cost:
    embedding_size: 64
    hidden_size: 48
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    col_identities: true
    attn_cost_weight: 0.02
    cost_kind: linear     # linear | quad | logbarrier
    use_bias: true
    dropout: 0.0

  grnn_fix_v5:
    embedding_size: 64
    hidden_size: 60
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    n_lru_cols: 1
    beta_scale: 3.0
    timescale_spread: 1.0
    r_floor_min: 0.9
    r_floor_max: 0.95
    lru_grad_scale: 0.1
    reservoir_mult: 2
    spectral_radius: 0.95
    aux_div_weight: 0.05
    aux_gate_weight: 0.1
    aux_act_weight: 0.02
    aux_sat_weight: 0.02
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    use_bias: true
    dropout: 0.0

  grnn_lru:
    embedding_size: 64
    hidden_size: 128
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    col_identities: true
    dropout: 0.0
    ff_mult: 2          # множитель PFFN
    r_min: 0.0          # минимальный радиус собственных значений
    r_max: 0.999        # максимальный радиус
    lru_r_per_col: true # разные r_max по столбцам (иерархия масштабов)

  grnn_lru_wide:
    # Увеличенная версия для лучших метрик на text8/SDQ-hard
    embedding_size: 96
    hidden_size: 256
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    col_identities: true
    dropout: 0.0
    ff_mult: 3
    r_min: 0.0
    r_max: 0.9995
    lru_r_per_col: true

  grnn_lru_hop:
    embedding_size:  64
    hidden_size: 128
    n_layers:         3
    n_columns:        4
    n_attn_heads:     4
    messaging:        "post"
    dropout:          0.05
    ffn_expansion:    2
    attn_dropout:     0.05
    # LRU-гиперпараметры
    lru_r_min:        0.4
    lru_r_max:        0.99
    lru_max_phase:    2.094395   # pi * 2/3

  grnn_delta:
    embedding_size: 64
    hidden_size: 128
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    dropout: 0.0
    ff_mult: 2
    # LRU per-layer × per-col r_max hierarchy
    r_min_layers: 0.05
    r_max_layers: 0.999
    lru_r_per_col: true
    # two-scale delta memory
    dk_fast: 16
    dv_fast: 16
    dk_slow: 32
    dv_slow: 32
    mem_decay_fast: [0.3, 0.5, 0.7]
    mem_decay_slow: [0.95, 0.98, 0.999]
    use_cross_layer_skip: false

  grnn_delta_wide:
    embedding_size: 96
    hidden_size: 160
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    dropout: 0.0
    ff_mult: 3
    r_min_layers: 0.02
    r_max_layers: 0.9995
    lru_r_per_col: true
    dk_fast: 20
    dv_fast: 20
    dk_slow: 40
    dv_slow: 40
    mem_decay_fast: [0.2, 0.4, 0.6, 0.8]
    mem_decay_slow: [0.9, 0.95, 0.98, 0.999]
    use_cross_layer_skip: true

  grnn_harmonic:
    embedding_size: 64
    hidden_size: 128
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    dropout: 0.0
    ffn_expansion: 2
    attn_dropout: 0.0
    # 2D spectral LRU hierarchy
    r_min_col: 0.3
    r_min_layers: 0.7
    r_max_layers: 0.999
    # Surprise-Delta Memory
    dk: null    # default H // 4 = 32
    dv: null    # default H = 128
    ema_beta: 0.9
    ema_beta_min: 0.7    # per-layer EMA beta: layer0=0.7 (fast) → layerL=0.9 (slow)
    delta_decay: 0.99
    delta_decay_min: 0.95
    lam_base: 0.01
    # Frozen Reservoir (disabled for SDQ — short sequences)
    n_reservoir_cols: 0
    reservoir_hidden_size: 64
    r_res_min: 0.90
    r_res_max: 0.999
    multi_col_head: true    # mean over all columns for associative retrieval


  # --- external baselines ---

  delta_net:
    embedding_size: 64
    hidden_size: 128
    n_layers: 3

  hgrn2:
    embedding_size: 64
    hidden_size: 128
    n_layers: 3
    expand: 4

  mlstm:
    embedding_size: 64
    hidden_size: 128
    n_layers: 3

  grnn_base:
    embedding_size: 64
    hidden_size: 92
    n_layers: 1
    n_columns: 4
    use_bias: true
    dropout: 0.0

lr:
  val: 8e-4
  rel: 0.02
  lr: 0.005
  schedule: 2000
  warmup:
    val: 1e-9
    n_linear_steps: 50
    schedule: 100

curriculum:
  schedule: 2e+5
  key: Loss
  mode: speed           # speed | threshold | plateau | multiaxis

  # threshold / plateau: set key+minimization to track Acc, then set threshold
  # key: Acc
  # minimization: false
  # threshold: 0.75     # advance only when Acc >= 0.75

  # plateau only:
  # plateau_len: 5      # number of curriculum checks to track
  # plateau_tol: 0.02   # max std to consider metric stable

  # multiaxis only (ignores key/threshold above):
  # t_threshold: 0.75
  # store_threshold: 0.80
  # query_threshold: 0.70