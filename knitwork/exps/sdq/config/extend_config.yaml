seed: null
name: null 

log:
  enabled: true
  logger: aim
  project: knitwork
  schedule: 1e+6
  print_schedule: 5e+6

device: cuda
dtype: float32

gen: hard
model: rnn
rollout_len: 8
n_envs: 128
n_steps: 1e+9

# weight checkpointing (disabled by default). save_at: list of global steps;
# save_every: 0 disables periodic. files -> {save_dir}/{run_name}/step_{step}.pt
checkpoint:
  enabled: false
  save_dir: runs/checkpoints
  save_at: [40e6, 60e6]
  save_every: 0

gens:
  easy:
    n_keys: 5
    n_vals: 10
    T: 10
    p_store: 0.35
    p_query: 0.35
    count_stored: false
    count_queried: false
  
  hard:
    n_keys: 5
    n_vals: 10
    T: 10
    p_store: 0.35
    p_query: 0.35
    count_stored: true
    count_queried: true

  # eval-only: `hard` with longer episodes and sparser events, so store->query gaps
  # actually reach the [32,128) range. On `hard` (T=10) a 178K-query collection put
  # 264 examples in [32,64) and 1 in [64,128) - the long-memory end of every recall
  # curve was unmeasurable. Use via `analyze_columns_sdq.py --eval_gen=long`.
  long:
    n_keys: 5
    n_vals: 10
    T: 40
    p_store: 0.15
    p_query: 0.15
    count_stored: true
    count_queried: true


models:
  rnn:
    embedding_size: 64
    base_hidden_size: 128
    n_layers: 1
    use_bias: true
    dropout: 0.0
  
  grnn:
    embedding_size: 64
    base_hidden_size: 128
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    col_identities: False
    dropout: 0.0

  grnn_err:
    embedding_size: 64
    base_hidden_size: 110
    n_layers: 1
    n_columns: 2
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    col_identities: true

  hgrnn:
    embedding_size: 64
    hidden_size: 128
    n_layers: 1
    n_columns: 2
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0

  hgrnn_lru:
    embedding_size: 64
    hidden_size: 128
    n_layers: 2
    n_columns: 2
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    ffn_expansion: 2
    lru_r_min: 0.4
    lru_r_max: 0.99

  grnn_fw:
    embedding_size: 64
    hidden_size: 128
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4      
    messaging: post
    col_identities: true
    fw_decay: 0.9        
    fw_lr: 0.5      

  grnn_reservoir:
    hidden_size: 300
    embedding_size: 64
    n_layers: 3
    n_columns: 5 
    n_reservoir_cols: 2
    n_attn_heads: 4
    messaging: post
    col_identities: true
    spectral_radius: 0.9 
    reservoir_scale: 0.1 

  grnn_hgrn:
    embedding_size: 64
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    hidden_size: 160
    n_layers: 5
    col_identities: true
    beta_min: 0.0
    beta_max: 0.99

  grnn2:
    embedding_size: 72
    hidden_size: 128
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    col_identities: true

    vae_latent_dim: null
    vae_kl_weight: 1.0e-3
    use_time_gate: true

    time_gate_delay_scale: -2.0

    col_drop_prob: 0.0

  grnn_engram:
    embedding_size: 64
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    n_columns: 4
    hidden_size: 128

    n_layers: 4
    col_identities: true

    n_engram_slots: 16

    engram_top_k: 4

    engram_hebb_lr: 0.1
    engram_gate_write: true

  grnn_loss:
    embedding_size: 64
    hidden_size: 128
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    col_identities: true

  grnn_eq:
    embedding_size: 64
    hidden_size: 128
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    use_bias: true
    dropout: 0.0
    col_identities: true

  grnn_eq1:
    embedding_size: 64
    hidden_size: 128
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    use_bias: true
    dropout: 0.0
    col_identities: true

  grnn_disc:
    embedding_size: 64
    hidden_size: 128
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    use_bias: true
    dropout: 0.0
    col_identities: true

  grnn_adv_loss:
    embedding_size: 64
    hidden_size: 128
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    col_identities: true

  grnn_fusion:
    embedding_size: 64
    hidden_size: 192
    n_layers: 5
    n_columns: 5              # 3 trainable + 2 reservoir
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    col_identities: true
    all_cols_get_input: true
    use_cross_attention: true  # NEW: trainable читают из reservoir

    hgrn:
      enabled: true
      beta_min: 0.01
      beta_max: 0.95
      use_final_output_gate: true
      learnable_beta: true

    reservoir:
      enabled: true
      n_reservoir_cols: 2       # ~половина колонок заморожена
      spectral_radius: 0.9      # используется если spectral_radii=null
      spectral_radii: null      # null → автоматически [0.7, 0.95]
      reservoir_scale: 0.1

    diversity_loss:
      enabled: true
      total_weight: 0.05
      cosine_weight: 0.3
      cov_weight: 0.2
      var_weight: 0.1
      gate_entropy_weight: 0.05
      layer_weights: null
      cosine_margin: 0.5
      var_threshold: 0.1
      compute_every_n: 4       # NEW: вычислять каждые 4 шага → ~4× быстрее diversity



  grnn_prec_delta:
    embedding_size: 64
    hidden_size: 128
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    messaging: post
    col_identities: true
    delta_lr: 0.01
    delta_decay: 0.99
    beta2: 0.999
    eps: 1.0e-8

  grnn_ema_mem:
    embedding_size: 64
    hidden_size: 128
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    messaging: post
    col_identities: true
    ema_beta: 0.9
    lam_base: 0.01

  # fixed attention variants (architecture_analysis.md §7.1), ~200K params
  grnn_fix:
    embedding_size: 64
    hidden_size: 64
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    use_bias: true
    dropout: 0.0

  hgrnn_fix:
    embedding_size: 64
    hidden_size: 104
    n_layers: 1
    n_columns: 2
    n_attn_heads: 4
    use_bias: true
    dropout: 0.0

  grnn_fix_v3:
    embedding_size: 64
    hidden_size: 64
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    beta_scale: 3.0
    aux_div_weight: 0.05
    aux_gate_weight: 0.02
    aux_act_weight: 0.02
    aux_every: 8
    gate_std_target: 0.15
    use_bias: true
    dropout: 0.0

  grnn_fix_v4:
    embedding_size: 64
    hidden_size: 64
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.1
    aux_div_ramp_steps: 2e+7
    aux_gate_weight: 0.1
    aux_act_weight: 0.02
    aux_sat_weight: 0.02
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    use_bias: true
    dropout: 0.0

  hgrnn_fix_v4:
    embedding_size: 64
    hidden_size: 56
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.1
    aux_div_ramp_steps: 2e+7
    aux_gate_weight: 0.1
    aux_act_weight: 0.02
    aux_sat_weight: 0.02
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    use_bias: true
    dropout: 0.0

  # n_columns=8 scale-up (~391K params), matches the comet-diagnosed run:
  # emergent per-layer hub topology, but CKA showed a near-duplicate column
  # pair (0.80) and col_sim/max kept climbing in the run's second half.
  # beta_floor/aux_div_max_weight/aux_div_ramp_steps target exactly that.
  grnn_fix_v4_8c:
    embedding_size: 64
    hidden_size: 56
    n_layers: 2
    n_columns: 8
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.1
    aux_div_ramp_steps: 3e+7
    aux_gate_weight: 0.1
    aux_act_weight: 0.02
    aux_sat_weight: 0.02
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    use_bias: true
    dropout: 0.0

  # ablation: n_columns=6 at matched param budget (~409K) vs grnn_fix_v4_8c
  # (~391K) — CKA on the 8c run showed only ~6 of 8 columns non-redundant;
  # this checks whether the 2 extra columns earn their keep at same budget.
  grnn_fix_v4_6c:
    embedding_size: 64
    hidden_size: 68
    n_layers: 2
    n_columns: 6
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.1
    aux_div_ramp_steps: 3e+7
    aux_gate_weight: 0.1
    aux_act_weight: 0.02
    aux_sat_weight: 0.02
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    use_bias: true
    dropout: 0.0

  # n_columns=12 rerun of the 388K "optim 12c nodiag" run with column regularization
  # actually enabled. In that run optim silently zeroed aux_act_weight, and the column
  # analysis at 60M found 7 of 12 columns collapsed into one subspace (pairwise CKA
  # 0.51-0.83) with near-zero causal effect. Same shape/param count (388.41K), stronger
  # decorrelation: aux_act restored at 2x nominal, div weights up, ramp twice as fast.
  grnn_fix_v4_12c_reg:
    embedding_size: 64
    hidden_size: 44
    n_layers: 2
    n_columns: 12
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.08
    aux_div_max_weight: 0.15
    aux_div_ramp_steps: 1e+7
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 32
    aux_batch_frac: 0.25
    use_bias: true
    dropout: 0.0

  # attribution arm: aux_act ALONE, Barlow terms fully off. _12c_reg moved four knobs
  # at once, and the aux_tick_scale fix means div now runs at full weight for the first
  # time -- so leaving div at "baseline" values would no longer isolate anything.
  # Zeroing div is the only clean way to attribute the effect to activity decorrelation.
  grnn_fix_v4_12c_act:
    embedding_size: 64
    hidden_size: 44
    n_layers: 2
    n_columns: 12
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.0
    aux_div_max_weight: 0.0
    aux_div_ramp_steps: 0
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 32
    aux_batch_frac: 0.25
    use_bias: true
    dropout: 0.0

  # next iteration on _12c_reg. Fixes carried in: aux schedules now count env-steps,
  # pressure decays after 35M instead of holding to the end (long-gap recall and
  # curriculum progress both suffered), div_max raised to target the worst pair only,
  # cleaner Barlow estimate (half batch, no projection), and a head-balance term
  # against the pooled head funnelling 81% of the logit through one column.
  grnn_fix_v4_12c_reg2:
    embedding_size: 64
    hidden_size: 44
    n_layers: 2
    n_columns: 12
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.25
    aux_div_ramp_steps: 1e+7
    aux_hold_steps: 3.5e+7
    aux_decay_steps: 2e+7
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_head_weight: 0.05
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 44
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0

  # Two single-change arms off grnn_fix_v4_12c_reg2 (the best of the five 12C runs),
  # factorizing its head penalty. REG2 measures logit magnitude and penalizes it with
  # relu(max share - target); grnn_bal_causal changes WHAT is measured, grnn_bal_lb
  # changes HOW it is penalized. Every other field is byte-identical to REG2, and
  # neither term adds parameters, so all three sit at 388.41K.
  grnn_bal_causal:
    embedding_size: 64
    hidden_size: 44
    n_layers: 2
    n_columns: 12
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.25
    aux_div_ramp_steps: 1e+7
    aux_hold_steps: 35000000.0
    aux_decay_steps: 2e+7
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_head_weight: 0.05      # unchanged from REG2: causal term is ADDED, not swapped
    aux_causal_weight: 0.25    # <-- the only change
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 44
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0

  grnn_bal_lb:
    embedding_size: 64
    hidden_size: 44
    n_layers: 2
    n_columns: 12
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.25
    aux_div_ramp_steps: 1e+7
    aux_hold_steps: 35000000.0
    aux_decay_steps: 2e+7
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_head_weight: 0.0       # <-- swapped out: lb replaces relu(max), same quantity
    aux_lb_weight: 0.05        # <-- for it
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 44
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0

  # E9. The div+act family switched OFF. Until the aux-clock fix these terms were
  # multiplied by zero in every optim=true run ever made, so "does column decorrelation
  # help at all" has never actually been tested. This is the control that answers it.
  grnn_noaux:
    embedding_size: 64
    hidden_size: 44
    n_layers: 2
    n_columns: 12
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.0
    aux_div_max_weight: 0.0
    aux_div_ramp_steps: 1e+7
    aux_hold_steps: 35000000.0
    aux_decay_steps: 2e+7
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.0
    aux_sat_weight: 0.02
    aux_head_weight: 0.05
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 44
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0

  # E10. The causal leave-one-out term at a sane weight. Its first run used 0.25, which
  # the frozen clock turned into an effective 2.0 and drove accuracy to 0.838.
  grnn_bal_causal2:
    embedding_size: 64
    hidden_size: 44
    n_layers: 2
    n_columns: 12
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.25
    aux_div_ramp_steps: 1e+7
    aux_hold_steps: 35000000.0
    aux_decay_steps: 2e+7
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_head_weight: 0.05
    aux_causal_weight: 0.03
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 44
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0

  # ================= FLAGSHIP: grnn_x =======================================
  # Every mechanism that produced a positive signal in round 2, and nothing else.
  # Measured at 388K over 57-61M steps at matched curriculum (ep_len 19.3-20.0),
  # against a three-seed reference band of Acc++ 0.791-0.873:
  #
  #   IN  aux clock fixed (div+act finally run) - col_cka/frac_gt_06 went from
  #       0.167-0.197 in round 1 to 0.00 in all 11 round-2 arms. Largest single effect.
  #   IN  aux_route_weight 0.05 (route_lb) - the only arm that improved structure for
  #       free: in_max_share 0.093 vs 0.228-0.279, in_eff_cols 11.97/12, CKA 0.07,
  #       Acc++ 0.844 at the top of the band.
  #   IN  timescale_spread 0 (ts_flat) - monotone on both sides: spread 2 gave the worst
  #       Acc++ of all comparable arms (0.716), spread 0 the best distributedness.
  #   IN  early aux schedule - Acc++ 0.831, in_eff 10.18 vs ~9.0. Consistent with the
  #       column structure settling inside the first 1% of training.
  #
  #   OUT top_k        - 0.766, below the band, bought no distribution
  #   OUT redo         - 0.776, routing unchanged (in_max 0.266): revived columns went
  #                      unread
  #   OUT concat head  - 0.790, mid-band, no effect
  #   OUT bal_lb       - 0.793, dominated by route_lb on every axis
  #   OUT noise        - the run was broken by a NaN std over -inf-masked logits (fixed
  #                      in grnn_route.py, but unvalidated, so it stays out of the
  #                      flagship)
  #
  # Scale and budget follow the knitwork-sdq reference grnn.L2C16_10.09M: L2, C16,
  # n_envs 512, rollout_len 32, n_steps 1e9. hidden 244 -> 9.93M active parameters.
  # The 1e9 budget is not optional: the curriculum raises T by 1/K = 0.1 per accepted
  # tick and ticks about every 200K env-steps, so T: 10 -> 500 needs ~4900 accepted
  # ticks. 388K models stalled near T=20.
  #
  # Aux schedule holds early then decays to 0.3 by 3e8: structural pressure measurably
  # costs long-gap recall, and this run has to keep climbing the curriculum for 1e9
  # steps, so capacity is handed back to the task once the structure is set.
  grnn_x:
    embedding_size: 64
    hidden_size: 244
    n_layers: 2
    n_columns: 16
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 0.0      # ts_flat
    aux_div_weight: 0.05
    aux_div_max_weight: 0.25
    aux_div_ramp_steps: 1e+6   # early: pressure on before the structure sets
    aux_hold_steps: 5e+6
    aux_decay_steps: 3e+8
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_head_weight: 0.05
    aux_route_weight: 0.05     # route_lb
    top_k: 0
    noise_std: 0.0
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 64
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0

  # ---- 10M scale, curriculum target T=500 ----------------------------------
  # The reference runs in the Comet project knitwork-sdq (grnn.L2C16_10.09M etc) reach
  # gen/ep_lens ~500 and Acc++ ~0.94. Reaching that is mostly a budget question: the
  # curriculum raises T by 1/K = 0.1 per accepted tick and ticks every ~200K env-steps,
  # so T: 10 -> 500 needs ~4900 accepted ticks, i.e. of order 1e9 env-steps. Capacity
  # decides what FRACTION of ticks are accepted; 388K models stalled near T=20.
  # Matching the reference: L2, C16, n_envs 512, rollout_len 32, n_steps 1e9.
  # hidden 244 -> 9.935M, the closest parity to the reference 10.09M.
  # Aux schedule is stretched for the longer run but still ramps fast, since the column
  # structure settles within the first ~1% of training.
  grnn_big:
    embedding_size: 64
    hidden_size: 244
    n_layers: 2
    n_columns: 16
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.25
    aux_div_ramp_steps: 5e+6
    aux_hold_steps: 4e+8
    aux_decay_steps: 3e+8
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_head_weight: 0.05
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 64
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0

  # ---- 10M scale, curriculum target T=500 ----------------------------------
  # The reference runs in the Comet project knitwork-sdq (grnn.L2C16_10.09M etc) reach
  # gen/ep_lens ~500 and Acc++ ~0.94. Reaching that is mostly a budget question: the
  # curriculum raises T by 1/K = 0.1 per accepted tick and ticks every ~200K env-steps,
  # so T: 10 -> 500 needs ~4900 accepted ticks, i.e. of order 1e9 env-steps. Capacity
  # decides what FRACTION of ticks are accepted; 388K models stalled near T=20.
  # Matching the reference: L2, C16, n_envs 512, rollout_len 32, n_steps 1e9.
  # hidden 244 -> 9.935M, the closest parity to the reference 10.09M.
  # Aux schedule is stretched for the longer run but still ramps fast, since the column
  # structure settles within the first ~1% of training.
  grnn_big_lb:
    embedding_size: 64
    hidden_size: 244
    n_layers: 2
    n_columns: 16
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.25
    aux_div_ramp_steps: 5e+6
    aux_hold_steps: 4e+8
    aux_decay_steps: 3e+8
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_head_weight: 0.0
    aux_lb_weight: 0.05
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 64
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0

  # ---- 10M scale, curriculum target T=500 ----------------------------------
  # The reference runs in the Comet project knitwork-sdq (grnn.L2C16_10.09M etc) reach
  # gen/ep_lens ~500 and Acc++ ~0.94. Reaching that is mostly a budget question: the
  # curriculum raises T by 1/K = 0.1 per accepted tick and ticks every ~200K env-steps,
  # so T: 10 -> 500 needs ~4900 accepted ticks, i.e. of order 1e9 env-steps. Capacity
  # decides what FRACTION of ticks are accepted; 388K models stalled near T=20.
  # Matching the reference: L2, C16, n_envs 512, rollout_len 32, n_steps 1e9.
  # hidden 244 -> 9.935M, the closest parity to the reference 10.09M.
  # Aux schedule is stretched for the longer run but still ramps fast, since the column
  # structure settles within the first ~1% of training.
  grnn_big_noaux:
    embedding_size: 64
    hidden_size: 244
    n_layers: 2
    n_columns: 16
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.0
    aux_div_max_weight: 0.0
    aux_div_ramp_steps: 5e+6
    aux_hold_steps: 4e+8
    aux_decay_steps: 3e+8
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.0
    aux_sat_weight: 0.02
    aux_head_weight: 0.05
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 64
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0

  # E1. Same terms as REG2, whole schedule compressed into the first 2M steps.
  # col_cka shows the column structure is settled by ~0.6M and flat for the next 60M,
  # so REG2's 1e7 ramp reaches full weight roughly 20x too late to shape anything.
  grnn_early:
    embedding_size: 64
    hidden_size: 44
    n_layers: 2
    n_columns: 12
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.25
    aux_div_ramp_steps: 3e+5
    aux_hold_steps: 1e+6
    aux_decay_steps: 1e+6
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_head_weight: 0.05
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 44
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0

  # E2. Identical to REG2 except the multi-timescale prior is off. Causal delta
  # correlates negatively with column index in all five arms (fast half holds 76% of
  # the mass): the stagger may be what kills the slow half rather than diversifying it.
  grnn_ts_flat:
    embedding_size: 64
    hidden_size: 44
    n_layers: 2
    n_columns: 12
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 0.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.25
    aux_div_ramp_steps: 1e+7
    aux_hold_steps: 35000000.0
    aux_decay_steps: 2e+7
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_head_weight: 0.05
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 44
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0

  # E3. The opposite direction: twice the stagger. Separates "the prior is harmful"
  # from "the prior is right but too weak to matter" -- E2 alone cannot.
  grnn_ts_wide:
    embedding_size: 64
    hidden_size: 44
    n_layers: 2
    n_columns: 12
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 2.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.25
    aux_div_ramp_steps: 1e+7
    aux_hold_steps: 35000000.0
    aux_decay_steps: 2e+7
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_head_weight: 0.05
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 44
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0

  # E4. REG2 with a per-column readout instead of the mean. Structural alternative to
  # the head penalty: each column owns its slice, so no column can be substituted by
  # the others' average. E=62 keeps the count at parity (386.93K, -0.4%).
  grnn_concat:
    embedding_size: 62
    hidden_size: 44
    n_layers: 2
    n_columns: 12
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.25
    aux_div_ramp_steps: 1e+7
    aux_hold_steps: 35000000.0
    aux_decay_steps: 2e+7
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_head_weight: 0.0
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 44
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0
    pooled_head: false

  # E5. Periodic re-initialization of columns whose readout share collapses. The only
  # mechanism here that can undo an early commitment rather than penalize it.
  grnn_redo:
    embedding_size: 64
    hidden_size: 44
    n_layers: 2
    n_columns: 12
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.25
    aux_div_ramp_steps: 1e+7
    aux_hold_steps: 35000000.0
    aux_decay_steps: 2e+7
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_head_weight: 0.05
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 44
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0
    redo_every: 5e+6
    redo_threshold: 0.02
    redo_max_cols: 1

  # E6. Load balance on in-degree: no column may become the hub everyone reads.
  # Self-attention is already masked to -inf, so a hub is the only routing collapse
  # available -- and no arm has ever measured it.
  grnn_route_lb:
    embedding_size: 64
    hidden_size: 44
    n_layers: 2
    n_columns: 12
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.25
    aux_div_ramp_steps: 1e+7
    aux_hold_steps: 35000000.0
    aux_decay_steps: 2e+7
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_head_weight: 0.05
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 44
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0
    aux_route_weight: 0.05

  # E7. Hard cap: a column may read at most 3 of the other 11. A capacity constraint
  # cannot be traded against the task loss the way all five soft penalties were.
  grnn_route_topk:
    embedding_size: 64
    hidden_size: 44
    n_layers: 2
    n_columns: 12
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.25
    aux_div_ramp_steps: 1e+7
    aux_hold_steps: 35000000.0
    aux_decay_steps: 2e+7
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_head_weight: 0.05
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 44
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0
    top_k: 3

  # E8. Relative noise on the routing logits, breaking the rich-get-richer loop that
  # locks in an early accidental winner. Scaled by the logits' own std, so the
  # learnable beta cannot make it negligible by growing.
  grnn_route_noise:
    embedding_size: 64
    hidden_size: 44
    n_layers: 2
    n_columns: 12
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.25
    aux_div_ramp_steps: 1e+7
    aux_hold_steps: 35000000.0
    aux_decay_steps: 2e+7
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_head_weight: 0.05
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 44
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0
    noise_std: 0.3

  # GridRnnRobust: every finding of the 12C study rolled into one config.
  # Barlow off (activity decorrelation decorrelates better on its own), pressure
  # decays after 35M, head-balance term at 3x the REG2 weight, and column dropout
  # regularizing the quantity we actually care about - the maximum causal
  # contribution of any single column. 388.41K params, same as every 12C arm.
  grnn_robust:
    embedding_size: 64
    hidden_size: 44
    n_layers: 2
    n_columns: 12
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.0
    aux_div_max_weight: 0.1
    aux_div_ramp_steps: 1e+7
    aux_hold_steps: 3.5e+7
    aux_decay_steps: 2e+7
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_head_weight: 0.15
    col_dropout: 0.1
    col_dropout_ramp_steps: 1e+7
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 44
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0

  # structural alternative to aux_head_weight: concat head instead of the pooled one,
  # so the readout cannot funnel through a single column by construction. The concat
  # head costs 4840 params at C=12/H=44, so embedding_size drops 64 -> 62 to stay in
  # budget: 386.93K vs 388.41K (-0.4%), the closest match since H is quantized to
  # multiples of n_attn_heads.
  grnn_robust_concat:
    embedding_size: 62
    hidden_size: 44
    n_layers: 2
    n_columns: 12
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.0
    aux_div_max_weight: 0.1
    aux_div_ramp_steps: 1e+7
    aux_hold_steps: 3.5e+7
    aux_decay_steps: 2e+7
    aux_final_frac: 0.3
    aux_gate_weight: 0.1
    aux_act_weight: 0.04
    aux_sat_weight: 0.02
    aux_head_weight: 0.0
    col_dropout: 0.1
    col_dropout_ramp_steps: 1e+7
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    pooled_head: false
    div_latent_dim: 44
    aux_batch_frac: 0.5
    use_bias: true
    dropout: 0.0

  # scale-up presets (optim=true: latent Barlow + batch-subsample aux + pooled head
  # + per-step grad checkpointing). ~2.0M and ~10.1M params at V=27/E=64.
  grnn_fix_v4_2m:
    embedding_size: 64
    hidden_size: 168
    n_layers: 2
    n_columns: 6
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.1
    aux_div_ramp_steps: 3e+7
    aux_gate_weight: 0.1
    aux_act_weight: 0.02
    aux_sat_weight: 0.02
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 32
    aux_batch_frac: 0.25
    use_bias: true
    dropout: 0.0

  grnn_fix_v4_10m:
    embedding_size: 64
    hidden_size: 344
    n_layers: 2
    n_columns: 8
    n_attn_heads: 4
    beta_scale: 3.0
    beta_floor: 0.2
    timescale_spread: 1.0
    aux_div_weight: 0.05
    aux_div_max_weight: 0.1
    aux_div_ramp_steps: 3e+7
    aux_gate_weight: 0.1
    aux_act_weight: 0.02
    aux_sat_weight: 0.02
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    optim: true
    div_latent_dim: 32
    aux_batch_frac: 0.25
    use_bias: true
    dropout: 0.0

  # base GRNN + top-down feedback: buffer columns get their own prev top-layer
  # output (+ distinct learnable seed) as layer-0 input. H=44 -> ~194K params
  grnn_feedback:
    embedding_size: 64
    hidden_size: 44
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    col_identities: true
    seed_scale: 1.0
    fb_init: 0.1
    use_bias: true
    dropout: 0.0

  # base GRNN + attention-cost penalty (sparse gates). H=48 -> ~185K params
  grnn_attn_cost:
    embedding_size: 64
    hidden_size: 48
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    col_identities: true
    attn_cost_weight: 0.02
    cost_kind: linear     # linear | quad | logbarrier
    use_bias: true
    dropout: 0.0

  grnn_fix_v5:
    embedding_size: 64
    hidden_size: 60
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    n_lru_cols: 1
    beta_scale: 3.0
    timescale_spread: 1.0
    r_floor_min: 0.9
    r_floor_max: 0.95
    lru_grad_scale: 0.1
    reservoir_mult: 2
    spectral_radius: 0.95
    aux_div_weight: 0.05
    aux_gate_weight: 0.1
    aux_act_weight: 0.02
    aux_sat_weight: 0.02
    aux_every: 8
    gate_std_target: 0.15
    sat_target: 0.8
    use_bias: true
    dropout: 0.0

  grnn_lru:
    embedding_size: 64
    hidden_size: 128
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    col_identities: true
    dropout: 0.0
    ff_mult: 2          # множитель PFFN
    r_min: 0.0          # минимальный радиус собственных значений
    r_max: 0.999        # максимальный радиус
    lru_r_per_col: true # разные r_max по столбцам (иерархия масштабов)

  grnn_lru_wide:
    # Увеличенная версия для лучших метрик на text8/SDQ-hard
    embedding_size: 96
    hidden_size: 256
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    col_identities: true
    dropout: 0.0
    ff_mult: 3
    r_min: 0.0
    r_max: 0.9995
    lru_r_per_col: true

  grnn_lru_hop:
    embedding_size:  64
    hidden_size: 128
    n_layers:         3
    n_columns:        4
    n_attn_heads:     4
    messaging:        "post"
    dropout:          0.05
    ffn_expansion:    2
    attn_dropout:     0.05
    # LRU-гиперпараметры
    lru_r_min:        0.4
    lru_r_max:        0.99
    lru_max_phase:    2.094395   # pi * 2/3

  grnn_delta:
    embedding_size: 64
    hidden_size: 128
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    dropout: 0.0
    ff_mult: 2
    # LRU per-layer × per-col r_max hierarchy
    r_min_layers: 0.05
    r_max_layers: 0.999
    lru_r_per_col: true
    # two-scale delta memory
    dk_fast: 16
    dv_fast: 16
    dk_slow: 32
    dv_slow: 32
    mem_decay_fast: [0.3, 0.5, 0.7]
    mem_decay_slow: [0.95, 0.98, 0.999]
    use_cross_layer_skip: false

  grnn_delta_wide:
    embedding_size: 96
    hidden_size: 160
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    dropout: 0.0
    ff_mult: 3
    r_min_layers: 0.02
    r_max_layers: 0.9995
    lru_r_per_col: true
    dk_fast: 20
    dv_fast: 20
    dk_slow: 40
    dv_slow: 40
    mem_decay_fast: [0.2, 0.4, 0.6, 0.8]
    mem_decay_slow: [0.9, 0.95, 0.98, 0.999]
    use_cross_layer_skip: true

  grnn_harmonic:
    embedding_size: 64
    hidden_size: 128
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    dropout: 0.0
    ffn_expansion: 2
    attn_dropout: 0.0
    # 2D spectral LRU hierarchy
    r_min_col: 0.3
    r_min_layers: 0.7
    r_max_layers: 0.999
    # Surprise-Delta Memory
    dk: null    # default H // 4 = 32
    dv: null    # default H = 128
    ema_beta: 0.9
    ema_beta_min: 0.7    # per-layer EMA beta: layer0=0.7 (fast) → layerL=0.9 (slow)
    delta_decay: 0.99
    delta_decay_min: 0.95
    lam_base: 0.01
    # Frozen Reservoir (disabled for SDQ — short sequences)
    n_reservoir_cols: 0
    reservoir_hidden_size: 64
    r_res_min: 0.90
    r_res_max: 0.999
    multi_col_head: true    # mean over all columns for associative retrieval


  # --- external baselines ---

  delta_net:
    embedding_size: 64
    hidden_size: 128
    n_layers: 3

  hgrn2:
    embedding_size: 64
    hidden_size: 128
    n_layers: 3
    expand: 4

  mlstm:
    embedding_size: 64
    hidden_size: 128
    n_layers: 3

  grnn_base:
    embedding_size: 64
    hidden_size: 92
    n_layers: 1
    n_columns: 4
    use_bias: true
    dropout: 0.0

lr:
  val: 8e-4
  rel: 0.02
  lr: 0.005
  schedule: 2000
  warmup:
    val: 1e-9
    n_linear_steps: 50
    schedule: 100

curriculum:
  schedule: 2e+5
  key: Loss
  mode: speed           # speed | threshold | plateau | multiaxis

  # threshold / plateau: set key+minimization to track Acc, then set threshold
  # key: Acc
  # minimization: false
  # threshold: 0.75     # advance only when Acc >= 0.75

  # plateau only:
  # plateau_len: 5      # number of curriculum checks to track
  # plateau_tol: 0.02   # max std to consider metric stable

  # multiaxis only (ignores key/threshold above):
  # t_threshold: 0.75
  # store_threshold: 0.80
  # query_threshold: 0.70