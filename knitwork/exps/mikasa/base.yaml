seed: null
name: null
log:
  logger: comet
  project: knitwork-mikasa
  schedule: 2.0e+6

device: null
dtype: float32

env-id: 0
model: rnn
n_envs: 128
async_envs: false
rollout_len: 8
n_steps: 2.0e+7

inspect_schedule: 1.0e+5
vis_inspect_schedule: 1.0e+5

vis_interval: 5.0e+6
entropy_coef: 0.005

eval:
  enabled: true
  on_start: true
  split: 0.1
  context_window: 100
  schedule: 5.0e+6
  max_rollout: 1.0e+4

# ======> Models
rnn:
  embedding_size: 64
  base_hidden_size: 128
  n_layers: 1
  use_bias: true
  dropout: 0.0

grnn:
  embedding_size: 64
  base_hidden_size: 128
  n_layers: 3
  n_columns: 4
  n_attn_heads: 4
  messaging: post
  use_bias: true
  col_identities: true
  dropout: 0.0

grnn_lru:
  embedding_size: 64
  hidden_size: 128
  n_layers: 3
  n_columns: 4
  n_attn_heads: 4
  messaging: post
  use_bias: true
  col_identities: true
  dropout: 0.0
  ff_mult: 2
  r_min: 0.0
  r_max: 0.999
  lru_r_per_col: true

grnn_lru_wide:
  embedding_size: 96
  hidden_size: 192
  n_layers: 4
  n_columns: 4
  n_attn_heads: 4
  messaging: post
  use_bias: true
  col_identities: true
  dropout: 0.0
  ff_mult: 3
  r_min: 0.0
  r_max: 0.9995
  lru_r_per_col: true

hgrnn:
  embedding_size: 64
  hidden_size: 128
  n_layers: 3
  n_columns: 4
  n_attn_heads: 4
  messaging: post
  use_bias: true
  dropout: 0.0

hgrnn_lru:
  embedding_size: 64
  hidden_size: 128
  n_layers: 3
  n_columns: 4
  n_attn_heads: 4
  messaging: post
  use_bias: true
  dropout: 0.0
  ffn_expansion: 2
  attn_dropout: 0.0
  lru_r_min: 0.0
  lru_r_max: 0.999

hgrn_grnn:
  embedding_size: 64
  hidden_size: 128
  n_layers: 3
  n_columns: 4
  n_attn_heads: 4
  messaging: post
  col_identities: true
  use_bias: true
  dropout: 0.0

grnn_fw:
  embedding_size: 64
  hidden_size: 128
  n_layers: 3
  n_columns: 4
  n_attn_heads: 4
  messaging: post
  col_identities: true
  use_bias: true
  dropout: 0.0

grnn_reservoir:
  embedding_size: 64
  hidden_size: 128
  n_layers: 3
  n_columns: 4
  n_attn_heads: 4
  messaging: post
  col_identities: true
  use_bias: true
  dropout: 0.0

grnn_loss:
  embedding_size: 64
  hidden_size: 128
  n_layers: 3
  n_columns: 4
  n_attn_heads: 4
  messaging: post
  col_identities: true
  use_bias: true
  dropout: 0.0

grnn_engram:
  embedding_size: 64
  hidden_size: 128
  n_layers: 3
  n_columns: 4
  n_attn_heads: 4
  messaging: post
  col_identities: true
  use_bias: true
  dropout: 0.0

grnn_prec_delta:
  embedding_size: 64
  hidden_size: 128
  n_layers: 2
  n_columns: 3
  n_attn_heads: 4
  messaging: post
  col_identities: true
  delta_lr: 0.01
  delta_decay: 0.99
  beta2: 0.999
  eps: 1.0e-8

grnn_ema_mem:
  embedding_size: 64
  hidden_size: 128
  n_layers: 2
  n_columns: 3
  n_attn_heads: 4
  messaging: post
  col_identities: true
  ema_beta: 0.9
  lam_base: 0.01

grnn_delta:
  embedding_size: 64
  hidden_size: 128
  n_layers: 2
  n_columns: 3
  n_attn_heads: 4
  messaging: post
  dropout: 0.0
  ff_mult: 2
  r_min_layers: 0.0
  r_max_layers: 0.999
  lru_r_per_col: true

grnn_harmonic:
  embedding_size: 40
  hidden_size: 76
  n_layers: 2
  n_columns: 4
  n_attn_heads: 4
  messaging: post
  dropout: 0.0
  ffn_expansion: 2
  attn_dropout: 0.0
  r_min_col: 0.3
  r_min_layers: 0.7
  r_max_layers: 0.999
  ema_beta: 0.9
  ema_beta_min: 0.7
  delta_decay: 0.99
  delta_decay_min: 0.95
  lam_base: 0.01
  n_reservoir_cols: 0      # reservoir wrong for short RL episodes (τ≫ep_len)
  reservoir_hidden_size: 32
  r_res_min: 0.90
  r_res_max: 0.999
  multi_col_head: false    # col0 only — focused policy representation for RL

# --- external baselines ---
delta_net:
  embedding_size: 64
  hidden_size: 128
  n_layers: 3

hgrn2:
  embedding_size: 64
  hidden_size: 128
  n_layers: 3
  expand: 4

mlstm:
  embedding_size: 64
  hidden_size: 128
  n_layers: 3

# fixed attention variants (architecture_analysis.md §7.1), ~200K params
grnn_fix:
  embedding_size: 32
  hidden_size: 64
  n_layers: 1
  n_columns: 3
  n_attn_heads: 4
  use_bias: true
  dropout: 0.0

hgrnn_fix:
  embedding_size: 64
  hidden_size: 104
  n_layers: 1
  n_columns: 2
  n_attn_heads: 4
  use_bias: true
  dropout: 0.0

grnn_fix_v3:
  embedding_size: 64
  hidden_size: 64
  n_layers: 2
  n_columns: 3
  n_attn_heads: 4
  beta_scale: 3.0
  aux_div_weight: 0.05
  aux_gate_weight: 0.02
  aux_act_weight: 0.02
  aux_every: 8
  gate_std_target: 0.15
  use_bias: true
  dropout: 0.0

grnn_fix_v4:
  embedding_size: 64
  hidden_size: 64
  n_layers: 2
  n_columns: 3
  n_attn_heads: 4
  beta_scale: 3.0
  timescale_spread: 1.0
  aux_div_weight: 0.05
  aux_gate_weight: 0.1
  aux_act_weight: 0.02
  aux_sat_weight: 0.02
  aux_every: 8
  gate_std_target: 0.15
  sat_target: 0.8
  use_bias: true
  dropout: 0.1

hgrnn_fix_v4:
  embedding_size: 64
  hidden_size: 56
  n_layers: 2
  n_columns: 3
  n_attn_heads: 4
  beta_scale: 3.0
  timescale_spread: 1.0
  aux_div_weight: 0.05
  aux_gate_weight: 0.1
  aux_act_weight: 0.02
  aux_sat_weight: 0.02
  aux_every: 8
  gate_std_target: 0.15
  sat_target: 0.8
  use_bias: true
  dropout: 0.0

grnn_fix_v5:
  embedding_size: 64
  hidden_size: 60
  n_layers: 2
  n_columns: 3
  n_attn_heads: 4
  n_lru_cols: 1
  beta_scale: 3.0
  timescale_spread: 1.0
  r_floor_min: 0.9
  r_floor_max: 0.95
  lru_grad_scale: 0.1
  reservoir_mult: 2
  spectral_radius: 0.95
  aux_div_weight: 0.05
  aux_gate_weight: 0.1
  aux_act_weight: 0.02
  aux_sat_weight: 0.02
  aux_every: 8
  gate_std_target: 0.15
  sat_target: 0.8
  use_bias: true
  dropout: 0.1
# <====== Models

# Auxiliary column loss (anti-collapse regulariser for grid models)
aux_col_idx: 2
aux_col_weight: 0.0  # set > 0 to enable, e.g. 0.1

env-ids:
# ==> discrete obs + discrete actions:
  # object memory
  - popgym-RepeatFirstEasy-v0
  - popgym-RepeatFirstMedium-v0
  - popgym-RepeatFirstHard-v0
  # object + sequential
  - popgym-RepeatPreviousEasy-v0
  - popgym-RepeatPreviousMedium-v0
  - popgym-RepeatPreviousHard-v0
  - popgym-HigherLowerEasy-v0
  - popgym-HigherLowerMedium-v0
  - popgym-HigherLowerHard-v0
  # object + capacity
  - popgym-MultiarmedBanditEasy-v0
  - popgym-MultiarmedBanditMedium-v0
  - popgym-MultiarmedBanditHard-v0
# ==> continuous obs (use continuous-wrappers from rl_wrappers.py):
  # capacity
  - popgym-CountRecallEasy-v0
  # sequential
  - popgym-AutoencodeEasy-v0

overrides:
  HalfCheetah-v5:
    reward_scale: 0.25
  Walker2d-v5:
  Hopper-v5:
  Pusher-v5:
    reward_scale: 10.0
  Humanoid-v5:
    reward_scale: 0.3
    agents.base.replay_buffer: 5.0e+6
    trackers.rl: 0.001
  Ant-v5:
    agents.base.replay_buffer: 18.0e+6
  InvertedDoublePendulum-v5:
    reward_scale: 0.5
  Reacher-v5:
    reward_scale: 50.0

# # LR schedule
# lr:
#   val: 8.0e-4
#   rel: 0.02
#   lr: 0.005
#   schedule: 2000
#   warmup:
#     val: 1e-9
#     n_linear_steps: 1    # 1 × 20 × 16384 ≈ 330K steps warmup
#     schedule: 20

# base LR config
lr:
  val: 8.0e-4
  tar: 5.0e-5
  lr: 0.005
  schedule: 2000
  warmup:
    val: 1e-9
    n_linear_steps: 50
    schedule: 100

trackers:
  slow: 2.0e-4
  fast: 1.0e-2
  eval: null
