seed: null
name: null
log:
  logger: comet
  project: knitwork-mikasa
  schedule: 1.0e+5

device: null
dtype: float32

exp: rl_mikasa
env-id: 0
env: null
model: rnn.L1

n_envs: 64
async_envs: false
rollout_len: 8
n_steps: 5.0e+5

rl:
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.005
  max_grad_norm: 0.5
  ppo_epochs: 4

inspect_schedule: 1.0e+5
vis_inspect_schedule: 1.0e+5

communication:
  loss_weight: 5.0e-2
  entropy_weight: 5.0e-3

# ======> Models
rnn_L1:
  hidden_size: 128
  n_layers: 1
  use_bias: true
  dropout: 0.0

rnn_L2:
  hidden_size: 92
  n_layers: 2
  use_bias: true
  dropout: 0.0

grnn_L1C2:
  hidden_size: 80
  n_layers: 1
  n_columns: 2
  n_attn_heads: 4
  ln_msg: true
  bank: 2
  mha: 2
  noise_std: 0.1

grnn_L1C8:
  hidden_size: 44
  n_layers: 1
  n_columns: 8
  n_attn_heads: 4
  ln_msg: true
  bank: 2
  mha: 2
  noise_std: 0.1

grnn_L2C4:
  hidden_size: 44
  n_layers: 2
  n_columns: 4
  n_attn_heads: 4
  ln_msg: true
  bank: 2
  mha: 2
  noise_std: 0.1

delta_net:
  hidden_size: 86
  n_layers: 2

hgrn2:
  hidden_size: 60
  n_layers: 2
  expand: 4

mlstm:
  hidden_size: 86
  n_layers: 2

# <====== Models

env-ids:
  # discrete observations + discrete actions
  # object memory
  - popgym-RepeatFirstEasy-v0
  - popgym-RepeatFirstMedium-v0
  - popgym-RepeatFirstHard-v0
  # object + sequential memory
  - popgym-RepeatPreviousEasy-v0
  - popgym-RepeatPreviousMedium-v0
  - popgym-RepeatPreviousHard-v0
  - popgym-HigherLowerEasy-v0
  - popgym-HigherLowerMedium-v0
  - popgym-HigherLowerHard-v0
  # object + capacity memory
  - popgym-MultiarmedBanditEasy-v0
  - popgym-MultiarmedBanditMedium-v0
  - popgym-MultiarmedBanditHard-v0
  # capacity memory, vector observations
  - popgym-CountRecallEasy-v0
  # sequential memory, vector observations
  - popgym-AutoencodeEasy-v0

# Reference examples from the off-policy project. PPO/MIKASA ignores them.
overrides:
  HalfCheetah-v5:
    reward_scale: 0.25
  Walker2d-v5:
  Hopper-v5:
  Pusher-v5:
    reward_scale: 10.0
  Humanoid-v5:
    reward_scale: 0.3
    agents.base.replay_buffer: 5.0e+6
    trackers.rl: 0.001
  Ant-v5:
    agents.base.replay_buffer: 18.0e+6
  InvertedDoublePendulum-v5:
    reward_scale: 0.5

lr:
  val: 8.0e-4
  tar: 5.0e-5
  lr: 0.005
  schedule: 2000
  warmup:
    val: 1.0e-9
    n_linear_steps: 50
    schedule: 100

trackers:
  slow: 2.0e-4
  fast: 1.0e-2
  eval: null
