seed: null
name: null
log:
  logger: comet
  project: knitwork-mikasa
  schedule: 5.0e+5

device: null
dtype: float32

# prio-debug: 0,3,6
# prio-run: 4,7
# high-risk: 5,1,2

exp: rl_mikasa
env-id: 0
env: null
model: rnn.L1

n_envs: 512
async_envs: false
rollout_len: 32
n_steps: 1.0e+9
compile: true

rl:
  gamma: 0.995
  gae_lambda: 0.95
  clip_eps: 0.1
  value_coef: 0.5
  entropy_coef: 0.005
  max_grad_norm: 0.5
  ppo_epochs: 4

inspect_schedule: 5.0e+5
vis_inspect_schedule: 5.0e+5

communication:
  loss_weight: 5.0e-2
  entropy_weight: 5.0e-3

# ======> Models
rnn_L1:
  hidden_size: 1296
  n_layers: 1
  use_bias: true
  dropout: 0.0

rnn_L2:
  hidden_size: 912
  n_layers: 2
  use_bias: true
  dropout: 0.0

rnn_L3:
  hidden_size: 752
  n_layers: 3
  use_bias: true
  dropout: 0.0

grnn_L1C8:
  hidden_size: 440
  n_layers: 1
  n_columns: 8
  n_attn_heads: 4
  ln_msg: true
  bank: 2
  mha: 2
  noise_std: 0.05

grnn_L2C4:
  hidden_size: 424
  n_layers: 2
  n_columns: 4
  n_attn_heads: 4
  ln_msg: true
  bank: 2
  mha: 2
  noise_std: 0.05

grnn_L2C8:
  hidden_size: 312
  n_layers: 2
  n_columns: 8
  n_attn_heads: 4
  ln_msg: true
  bank: 2
  mha: 2
  noise_std: 0.05

grnn_L2C16:
  hidden_size: 224
  n_layers: 2
  n_columns: 16
  n_attn_heads: 4
  ln_msg: true
  bank: 2
  mha: 2
  noise_std: 0.05

grnn_L3C4:
  hidden_size: 344
  n_layers: 3
  n_columns: 4
  n_attn_heads: 4
  ln_msg: true
  bank: 2
  mha: 2
  noise_std: 0.05

delta_net:
  hidden_size: 692
  n_layers: 3

hgrn2:
  hidden_size: 490
  n_layers: 3
  expand: 4

mlstm:
  hidden_size: 692
  n_layers: 3

# <====== Models

env-ids:
  # discrete observations + discrete actions
  # object memory
  - popgym-RepeatFirstEasy-v0
  - popgym-RepeatFirstMedium-v0
  - popgym-RepeatFirstHard-v0
  # object + sequential memory
  - popgym-RepeatPreviousEasy-v0
  - popgym-RepeatPreviousMedium-v0
  - popgym-RepeatPreviousHard-v0
  - popgym-HigherLowerEasy-v0
  - popgym-HigherLowerMedium-v0
  - popgym-HigherLowerHard-v0
  # object + capacity memory
  - popgym-MultiarmedBanditEasy-v0
  - popgym-MultiarmedBanditMedium-v0
  - popgym-MultiarmedBanditHard-v0
  # capacity memory, vector observations
  - popgym-CountRecallEasy-v0
  # sequential memory, vector observations
  - popgym-AutoencodeEasy-v0

# Reference examples from the off-policy project. PPO/MIKASA ignores them.
overrides:
  HalfCheetah-v5:
    reward_scale: 0.25
  Walker2d-v5:
  Hopper-v5:
  Pusher-v5:
    reward_scale: 10.0
  Humanoid-v5:
    reward_scale: 0.3
    agents.base.replay_buffer: 5.0e+6
    trackers.rl: 0.001
  Ant-v5:
    agents.base.replay_buffer: 18.0e+6
  InvertedDoublePendulum-v5:
    reward_scale: 0.5

lr:
  val: 5.0e-4
  tar: 5.0e-5
  lr: 0.01
  schedule: 250
  warmup:
    val: 1.0e-9
    n_linear_steps: 50
    schedule: 24

trackers:
  slow: 5.0e-3
  fast: 2.0e-2
  eval: null
