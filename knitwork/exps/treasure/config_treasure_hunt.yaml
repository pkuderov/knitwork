# config_treasure_hunt.yaml
# TreasureHunt: RL-бенчмарк ассоциативной памяти
seed: 42
name: null

log:
  enabled: true
  logger: aim
  project: grid-rnn-treasure
  schedule: 5.0e+5
  print_schedule: 1.0e+6

device: cuda
dtype: float32

env: easy
model: grnn_lru
rollout_len: 16
n_envs: 128
n_steps: 5.0e+8

# Конфигурации сред
envs:
  easy:
    grid_size: 8
    n_colors: 2
    view_radius: 1
    max_steps: 100
    wall_density: 0.05
    min_key_door_dist: 2
    reward_open_door: 1.0
    reward_step: -0.01

  medium:
    grid_size: 10
    n_colors: 3
    view_radius: 1
    max_steps: 150
    wall_density: 0.10
    min_key_door_dist: 4
    reward_open_door: 1.0
    reward_step: -0.01

  hard:
    grid_size: 12
    n_colors: 4
    view_radius: 1
    max_steps: 200
    wall_density: 0.10
    min_key_door_dist: 6
    reward_open_door: 1.0
    reward_step: -0.01

  nightmare:
    # Максимальная нагрузка на ассоциативную память:
    # 6 пар, карта 15×15, ключи далеко от дверей
    grid_size: 15
    n_colors: 6
    view_radius: 1
    max_steps: 400
    wall_density: 0.12
    min_key_door_dist: 8
    reward_open_door: 1.0
    reward_step: -0.005

# 
models:
  rnn:
    embedding_size: 64
    base_hidden_size: 128
    n_layers: 1
    use_bias: true
    dropout: 0.0

  grnn:
    embedding_size: 64
    base_hidden_size: 128
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    col_identities: true
    dropout: 0.0

  grnn_lru:
    embedding_size: 64
    hidden_size: 128
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    col_identities: true
    dropout: 0.0
    ff_mult: 2
    r_min: 0.0
    r_max: 0.999
    lru_r_per_col: true

  hgrnn_lru:
    embedding_size: 64
    hidden_size: 128
    n_layers: 2
    n_columns: 2
    n_attn_heads: 4
    messaging: post
    use_bias: true
    dropout: 0.0
    ffn_expansion: 2
    lru_r_min: 0.4
    lru_r_max: 0.99

  grnn_lru_wide:
    embedding_size: 96
    hidden_size: 192
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    use_bias: true
    col_identities: true
    dropout: 0.0
    ff_mult: 3
    r_min: 0.0
    r_max: 0.9995
    lru_r_per_col: true

  grnn_prec_delta:
    embedding_size: 64
    hidden_size: 128
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    messaging: post
    col_identities: true
    delta_lr: 0.01
    delta_decay: 0.99
    beta2: 0.999
    eps: 1.0e-8

  grnn_ema_mem:
    embedding_size: 64
    hidden_size: 128
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    messaging: post
    col_identities: true
    ema_beta: 0.9
    lam_base: 0.01

  grnn_delta:
    embedding_size: 64
    hidden_size: 128
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    dropout: 0.0
    ff_mult: 2
    r_min_layers: 0.05
    r_max_layers: 0.999
    lru_r_per_col: true
    dk_fast: 16
    dv_fast: 16
    dk_slow: 32
    dv_slow: 32
    mem_decay_fast: [0.3, 0.5, 0.7]
    mem_decay_slow: [0.95, 0.98, 0.999]
    use_cross_layer_skip: false

  grnn_delta_wide:
    embedding_size: 96
    hidden_size: 160
    n_layers: 4
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    dropout: 0.0
    ff_mult: 3
    r_min_layers: 0.02
    r_max_layers: 0.9995
    lru_r_per_col: true
    dk_fast: 20
    dv_fast: 20
    dk_slow: 40
    dv_slow: 40
    mem_decay_fast: [0.2, 0.4, 0.6, 0.8]
    mem_decay_slow: [0.9, 0.95, 0.98, 0.999]
    use_cross_layer_skip: true

  grnn_harmonic:
    embedding_size: 64
    hidden_size: 128
    n_layers: 3
    n_columns: 4
    n_attn_heads: 4
    messaging: post
    dropout: 0.0
    ffn_expansion: 2
    attn_dropout: 0.0
    r_min_col: 0.3
    r_min_layers: 0.7
    r_max_layers: 0.999
    ema_beta: 0.9
    delta_decay: 0.99
    lam_base: 0.01
    n_reservoir_cols: 0
    reservoir_hidden_size: 32
    r_res_min: 0.90
    r_res_max: 0.999

  # fixed attention variants (architecture_analysis.md §7.1), ~200K params
  grnn_fix:
    embedding_size: 64
    hidden_size: 64
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    use_bias: true
    dropout: 0.0

  hgrnn_fix:
    embedding_size: 64
    hidden_size: 104
    n_layers: 1
    n_columns: 2
    n_attn_heads: 4
    use_bias: true
    dropout: 0.0

  grnn_fix_v3:
    embedding_size: 64
    hidden_size: 64
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    beta_scale: 3.0
    # RL runner unpacks (y, h): aux losses must stay disabled here
    aux_div_weight: 0.0
    aux_gate_weight: 0.0
    aux_act_weight: 0.0
    use_bias: true
    dropout: 0.0

  grnn_fix_v4:
    embedding_size: 64
    hidden_size: 64
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    beta_scale: 3.0
    timescale_spread: 1.0
    # RL runner unpacks (y, h): aux losses must stay disabled here
    aux_div_weight: 0.0
    aux_gate_weight: 0.0
    aux_act_weight: 0.0
    aux_sat_weight: 0.0
    use_bias: true
    dropout: 0.0

  hgrnn_fix_v4:
    embedding_size: 64
    hidden_size: 56
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    beta_scale: 3.0
    timescale_spread: 1.0
    # RL runner unpacks (y, h): aux losses must stay disabled here
    aux_div_weight: 0.0
    aux_gate_weight: 0.0
    aux_act_weight: 0.0
    aux_sat_weight: 0.0
    use_bias: true
    dropout: 0.0

  grnn_fix_v5:
    embedding_size: 64
    hidden_size: 60
    n_layers: 2
    n_columns: 3
    n_attn_heads: 4
    n_lru_cols: 1
    beta_scale: 3.0
    timescale_spread: 1.0
    r_floor_min: 0.9
    r_floor_max: 0.95
    lru_grad_scale: 0.1
    reservoir_mult: 2
    spectral_radius: 0.95
    # RL runner unpacks (y, h): aux losses must stay disabled here
    aux_div_weight: 0.0
    aux_gate_weight: 0.0
    aux_act_weight: 0.0
    aux_sat_weight: 0.0
    use_bias: true
    dropout: 0.0

# LR schedule (как в run_sdq2.py)
lr:
  val: 8.0e-4
  rel: 0.02
  lr: 0.005
  schedule: 2000
  warmup:
    val: 1e-9
    n_linear_steps: 50
    schedule: 100

# Curriculum
curriculum:
  schedule: 5.0e+5
  key: Loss