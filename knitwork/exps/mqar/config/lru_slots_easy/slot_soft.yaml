# Easy MQAR train (T64/K4, T128/K8). Test grids: capacity (T=256, K=4..32) and forgetting (K=8, T=64..1024).
seed: 42
device: null
dtype: float32
exp: mqar
model: grnn_lru_slots.slot_soft
output_dir: runs/mqar
log:
  logger: null
  project: knitwork-mqar
  schedule: 1000000.0
data:
  vocab_size: 8192
  power_a: 0.01
  random_non_queries: true
  train_seed: 100
  val_seed: 200
  test_seed: 300
  train:
  - input_seq_len: 64
    num_kv_pairs: 4
    num_examples: 100000
  - input_seq_len: 128
    num_kv_pairs: 8
    num_examples: 50000
  val:
  - input_seq_len: 64
    num_kv_pairs: 4
    num_examples: 1000
  - input_seq_len: 128
    num_kv_pairs: 8
    num_examples: 1000
  test:
  - input_seq_len: 64
    num_kv_pairs: 4
    num_examples: 1000
  - input_seq_len: 128
    num_kv_pairs: 8
    num_examples: 1000
  - input_seq_len: 256
    num_kv_pairs: 4
    num_examples: 1000
  - input_seq_len: 256
    num_kv_pairs: 8
    num_examples: 1000
  - input_seq_len: 256
    num_kv_pairs: 16
    num_examples: 1000
  - input_seq_len: 256
    num_kv_pairs: 32
    num_examples: 1000
  - input_seq_len: 64
    num_kv_pairs: 8
    num_examples: 1000
  - input_seq_len: 512
    num_kv_pairs: 8
    num_examples: 1000
  - input_seq_len: 1024
    num_kv_pairs: 8
    num_examples: 1000
training:
  epochs: 8
  max_updates: null
  batch_size: 32
  learning_rate: 0.001
  grad_clip: 1.0
  warmup_updates: 0
eval:
  schedule: 1000
  batch_size: 32
  state_seed: 1000
trackers:
  slow: 0.01
  eval: null
name: mqar_lru_slots_easy/slot_soft
grnn_lru_slots_slot_soft:
  hidden_size: 180
  n_layers: 2
  n_columns: 4
  horizon:
  - 1.0
  - 1000.0
  fb_norm: true
  hub_query_size: 8
  mode: slot_soft
  n_slots: 8
  slot_key_size: 16
  slot_value_size: 32
  memory_column: 3
  slot_write_bias: 0.0
