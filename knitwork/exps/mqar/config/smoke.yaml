# Two CPU updates; every mid-suite model is selectable with --model.
seed: 42
device: cpu
dtype: float32
exp: mqar
model: grnn_lru.L2C4
output_dir: runs/mqar-smoke
log:
  logger: null
  project: knitwork-mqar
  schedule: 1000000.0
data:
  vocab_size: 64
  power_a: 0.01
  random_non_queries: true
  train_seed: 100
  val_seed: 200
  test_seed: 300
  train:
  - input_seq_len: 16
    num_kv_pairs: 2
    num_examples: 8
  - input_seq_len: 32
    num_kv_pairs: 4
    num_examples: 8
  val:
  - input_seq_len: 16
    num_kv_pairs: 2
    num_examples: 4
  - input_seq_len: 32
    num_kv_pairs: 4
    num_examples: 4
  test:
  - input_seq_len: 16
    num_kv_pairs: 2
    num_examples: 4
  - input_seq_len: 32
    num_kv_pairs: 4
    num_examples: 4
training:
  epochs: 1
  max_updates: 2
  batch_size: 2
  learning_rate: 0.001
  grad_clip: 1.0
eval:
  schedule: 1
  batch_size: 2
  state_seed: 1000
grnn_lru_L2C4:
  hidden_size: 12
  n_layers: 2
  n_columns: 4
  horizon:
  - 1.0
  - 1000.0
  fb_norm: true
rnn_L2:
  hidden_size: 12
  n_layers: 2
  use_bias: true
  dropout: 0.0
trackers:
  slow: 0.01
  eval: null
grnn_lru_sparse_dynamic_hub_self_heavy:
  hidden_size: 12
  fb_norm: true
  n_layers: 2
  n_columns: 4
  horizon:
  - 1.0
  - 1000.0
  topology: star
  hub_query_size: 8
  routing_init: self_heavy
grnn_lru_sparse_entmax:
  hidden_size: 12
  n_layers: 2
  n_columns: 4
  horizon:
  - 1.0
  - 1000.0
  fb_norm: true
  routing_activation: entmax15
  routing_init: soft
grnn_lru_sparse_control:
  hidden_size: 12
  fb_norm: true
  n_layers: 2
  n_columns: 4
  horizon:
  - 1.0
  - 1000.0
grnn_lru_sparse_block:
  hidden_size: 12
  n_layers: 2
  n_columns: 4
  horizon:
  - 1.0
  - 1000.0
  fb_norm: true
  projection_groups: 2
  shuffle_between_layers: true
grnn_L2C4_core_mid:
