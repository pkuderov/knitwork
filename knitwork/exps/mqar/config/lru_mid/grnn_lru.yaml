# Standalone MQAR mid configuration; identical data/optimizer/checkpoint protocol.
seed: 42
device: null
dtype: float32
exp: mqar
model: grnn_lru.L2C4
output_dir: runs/mqar
log:
  logger: null
  project: knitwork-mqar
  schedule: 1000000.0
data:
  vocab_size: 8192
  power_a: 0.01
  random_non_queries: true
  train_seed: 100
  val_seed: 200
  test_seed: 300
  train:
  - input_seq_len: 64
    num_kv_pairs: 4
    num_examples: 100000
  - input_seq_len: 128
    num_kv_pairs: 8
    num_examples: 20000
  - input_seq_len: 256
    num_kv_pairs: 16
    num_examples: 20000
  - input_seq_len: 256
    num_kv_pairs: 32
    num_examples: 20000
  - input_seq_len: 256
    num_kv_pairs: 64
    num_examples: 20000
  val:
  - input_seq_len: 64
    num_kv_pairs: 4
    num_examples: 1000
  - input_seq_len: 128
    num_kv_pairs: 8
    num_examples: 1000
  - input_seq_len: 256
    num_kv_pairs: 16
    num_examples: 1000
  - input_seq_len: 256
    num_kv_pairs: 32
    num_examples: 1000
  - input_seq_len: 256
    num_kv_pairs: 64
    num_examples: 1000
  test:
  - input_seq_len: 64
    num_kv_pairs: 4
    num_examples: 1000
  - input_seq_len: 64
    num_kv_pairs: 8
    num_examples: 1000
  - input_seq_len: 64
    num_kv_pairs: 16
    num_examples: 1000
  - input_seq_len: 128
    num_kv_pairs: 32
    num_examples: 1000
  - input_seq_len: 256
    num_kv_pairs: 64
    num_examples: 1000
  - input_seq_len: 512
    num_kv_pairs: 128
    num_examples: 1000
  - input_seq_len: 1024
    num_kv_pairs: 256
    num_examples: 1000
training:
  epochs: 32
  max_updates: null
  batch_size: 32
  learning_rate: 0.001
  grad_clip: 1.0
eval:
  schedule: 1000
  batch_size: 32
  state_seed: 1000
trackers:
  slow: 0.01
  eval: null
grnn_lru_L2C4:
  hidden_size: 180
  n_layers: 2
  n_columns: 4
  horizon:
  - 1.0
  - 1000.0
  fb_norm: true
name: mqar_mid/grnn_lru
