seed: null
name: null
log:
  logger: comet
  project: knitwork-text-debug
  dump_status: false
  schedule: 5.0e+6
  # schedule: 1.0e+6

device: null
dtype: float32

exp: text
gen: text8
wrapper_model: token
model: rnn.L1

n_envs: 512
rollout_len: 64
n_steps: 1.0e+9
# n_steps: 0.4e+7

compile: true

inspect_schedule: 5.0e+5
vis_inspect_schedule: 5.0e+5
inspect_n_in_word_acc: 5

eval:
  enabled: true
  on_start: false
  # contiguous train|val|test on the raw stream; vocab from train only; test is evaluated once at the end
  val_size: 5.0e+6
  test_size: 5.0e+6
  schedule: 2.0e+7
  # also report (and select checkpoints on) eval with the state reset every `window` tokens
  window: 1024

gens:
  text8:
    path: $MY_HOME/data/text/text8.txt
    reset_prob:
      val: 0.2
      tar: 0.001
      lr: 0.04
      schedule: 100
      warmup:
        val: 0.1
        n_linear_steps: 100
        schedule: 15
        logspace: true
  tinysh:
    path: $MY_HOME/data/text/tinyshakespeare_1.1M.txt
    reset_prob:
      val: 0.2
      tar: 0.001
      lr: 0.04
      schedule: 100

token_wrapper: {}
communication:
  loss_weight: 5.0e-2
  entropy_weight: 5.0e-3

# ======> Models
# mid tier: ~1M params for every model (check: uv run python -m knitwork.common.state_size <this file>)
# --- param-matched GRU ---
rnn_L1:
  hidden_size: 404
  n_layers: 1
  use_bias: true
  dropout: 0.0

rnn_L2:
  hidden_size: 288
  n_layers: 2
  use_bias: true
  dropout: 0.0

rnn_L3:
  hidden_size: 232
  n_layers: 3
  use_bias: true
  dropout: 0.0

# --- MoSAIC (grid RNN) ---
grnn_L1C8:
  hidden_size: 140
  n_layers: 1
  n_columns: 8
  n_attn_heads: 4
  ln_msg: true
  bank: 2
  mha: 2
  noise_std: 0.05

grnn_L2C4:
  hidden_size: 136
  n_layers: 2
  n_columns: 4
  n_attn_heads: 4
  ln_msg: true
  bank: 2
  mha: 2
  noise_std: 0.05

grnn_L2C8:
  hidden_size: 96
  n_layers: 2
  n_columns: 8
  n_attn_heads: 4
  ln_msg: true
  bank: 2
  mha: 2
  noise_std: 0.05

grnn_L3C4:
  hidden_size: 112
  n_layers: 3
  n_columns: 4
  n_attn_heads: 4
  ln_msg: true
  bank: 2
  mha: 2
  noise_std: 0.05

# --- routing-sparsity ablation (E3): each column reads from its top-k sources only ---
grnn_L2C4_topk1:
  hidden_size: 136
  n_layers: 2
  n_columns: 4
  n_attn_heads: 4
  ln_msg: true
  bank: 2
  mha: 2
  noise_std: 0.05
  top_k: 1

grnn_L2C4_topk2:
  hidden_size: 136
  n_layers: 2
  n_columns: 4
  n_attn_heads: 4
  ln_msg: true
  bank: 2
  mha: 2
  noise_std: 0.05
  top_k: 2

# --- MoSAIC + LRU ---
grnn_lru_L1C8:
  hidden_size: 176
  n_layers: 1
  n_columns: 8
  # Initial e-folding horizons in recurrent steps, sampled log-uniformly.
  horizon: [1.0, 1000.0]
  # parameter-free RMS norm on the fed-back output; without it the residual loop overflows after ~1e3 steps
  fb_norm: true

grnn_lru_L2C4:
  hidden_size: 180
  n_layers: 2
  n_columns: 4
  # Initial e-folding horizons in recurrent steps, sampled log-uniformly.
  horizon: [1.0, 1000.0]
  # parameter-free RMS norm on the fed-back output; without it the residual loop overflows after ~1e3 steps
  fb_norm: true

grnn_lru_L2C8:
  hidden_size: 128
  n_layers: 2
  n_columns: 8
  # Initial e-folding horizons in recurrent steps, sampled log-uniformly.
  horizon: [1.0, 1000.0]
  # parameter-free RMS norm on the fed-back output; without it the residual loop overflows after ~1e3 steps
  fb_norm: true

grnn_lru_L3C4:
  hidden_size: 148
  n_layers: 3
  n_columns: 4
  # Initial e-folding horizons in recurrent steps, sampled log-uniformly.
  horizon: [1.0, 1000.0]
  # parameter-free RMS norm on the fed-back output; without it the residual loop overflows after ~1e3 steps
  fb_norm: true

# --- external baselines ---
delta_net:
  hidden_size: 217
  n_layers: 3

hgrn2:
  hidden_size: 153
  n_layers: 3
  expand: 4

mlstm:
  hidden_size: 216
  n_layers: 3

transformer:
  hidden_size: 176
  n_layers: 4
  n_heads: 4
  d_ff: 352
  mem_len: 256
  dropout: 0.0

mamba:
  hidden_size: 194
  n_layers: 4
  d_state: 16
  d_conv: 4
  expand: 2

# --- RIMs / BRIMs (6 modules, 3 active) ---
rims:
  n_modules: 6
  module_size: 116
  n_active: 3
  n_layers: 1

brims:
  n_modules: 6
  module_size: 80
  n_active: 3
  n_layers: 2
# <====== Models

# base LR config
lr:
  val: 5.0e-4
  tar: 5.0e-5
  lr: 0.01
  schedule: 250
  warmup:
    val: 1.0e-6
    n_linear_steps: 50
    schedule: 12
    logspace: true

trackers:
  slow: 5.0e-3
  fast: 2.0e-2
  list: null
  eval: null
